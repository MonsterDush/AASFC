<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260722-split1" />
  <link rel="stylesheet" href="/styles/pages/invites.css?v=20260720-unified7" />
  <script src="/page-loader.js?v=20260720-loader1"></script>
  <title>Axelio · Приглашения</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Приглашения и участники</b>
          <div class="muted">команда заведения</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card">
      <div id="selectorCard" class="itemcard mt-12 hidden">
        <b>Выбрать заведение</b>
        <div class="muted mt-6">Сначала выбери заведение, для которого нужно создать приглашение.</div>
        <div class="row mt-10">
          <select class="invite-venue-select invite-venue-select--wide" id="venueSelect"></select>
          <button class="btn primary" id="btnUseVenue">Выбрать</button>
          <a class="btn subtle inline" id="openLink" href="/invites.html">Открыть страницу</a>
        </div>
      </div>

      <div class="itemcard mt-12">
        <b id="inviteTitle">Пригласить участника</b>
        <div id="venueMeta" class="muted mt-6"></div>

        <div class="invite-grid">
          <div>
            <label class="muted">Способ приглашения</label>
            <select id="inviteChannel">
              <option value="TELEGRAM">Telegram</option>
              <option value="PHONE">Телефон</option>
            </select>
          </div>
          <div id="tgWrap">
            <label class="muted">Ник в Telegram</label>
            <input id="tg" placeholder="@username" />
          </div>
          <div class="hidden" id="phoneWrap">
            <label class="muted">Телефон</label>
            <input id="phone" placeholder="+7 999 123-45-67" />
          </div>
          <div>
            <label class="muted">Имя или заметка</label>
            <input id="contactLabel" placeholder="Иван / Новый кальянщик" />
          </div>
          <div>
            <label class="muted">Роль</label>
            <select id="role">
              <option value="STAFF">Персонал</option>
              <option value="OWNER">Владелец</option>
            </select>
          </div>
        </div>
        <div class="row mt-10">
          <button class="btn primary" id="btnInvite">Создать приглашение</button>
          <div id="inviteResult" class="muted"></div>
        </div>
      </div>

      <div class="itemcard mt-12">
        <b>Приглашения в ожидании</b>
        <div id="pending" class="mt-10"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>

      <div class="itemcard mt-12">
        <b>Участники</b>
        <div id="members" class="mt-10"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Детали</div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="nav"><div class="wrap"><div id="nav"></div></div></div>

  <script type="module">
    import {
      applyTelegramTheme,
      ensureLogin,
      api,
      toast,
      mountCommonUI,
      setActiveVenueId,
      getActiveVenueId,
      mountNav,
      getVenueById,
      getMyVenuePermissions,
      getMe,
      getStoredDemoUiState,
      isDemoReadonlyUi
    } from "/app.js?v=20260722-dynamic1";
    import { isOwnerRole, isSysAdminRole, permSetFromResponse, roleUpper, hasPerm } from "/permissions.js?v=20260321-miniappfix2";

    function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }
    function roleLabel(role){ return String(role || '').toUpperCase() === 'OWNER' ? 'Владелец' : 'Персонал'; }
    function channelLabel(channel){ return String(channel || '').toUpperCase() === 'PHONE' ? 'Телефон' : 'Telegram'; }

    applyTelegramTheme();
    mountCommonUI("invites");
    await ensureLogin({ silent:true });
    await mountNav({ activeTab: "none" });

    const params = new URLSearchParams(location.search);
    let venueId = params.get("venue_id") || getActiveVenueId();
    let venueName = "";
    let canManageStaff = false;
    let canInviteOwners = false;
    const demoState = getStoredDemoUiState();
    const demoReadonly = isDemoReadonlyUi(demoState);

    if (venueId) setActiveVenueId(venueId);

    const selectorCard = document.getElementById("selectorCard");
    const venueSelect = document.getElementById("venueSelect");
    const btnUseVenue = document.getElementById("btnUseVenue");
    const openLink = document.getElementById("openLink");
    const venueMeta = document.getElementById("venueMeta");
    const pending = document.getElementById("pending");
    const members = document.getElementById("members");
    const inviteResult = document.getElementById("inviteResult");
    const inviteChannel = document.getElementById("inviteChannel");
    const tgWrap = document.getElementById("tgWrap");
    const phoneWrap = document.getElementById("phoneWrap");
    const btnInvite = document.getElementById("btnInvite");
    const roleSelect = document.getElementById("role");

    async function refreshPermissions() {
      canManageStaff = false;
      canInviteOwners = false;
      if (!venueId) {
        applyInviteAccess();
        return;
      }
      try {
        const me = await getMe().catch(() => null);
        const perms = await getMyVenuePermissions(venueId);
        const pset = permSetFromResponse(perms);
        const role = roleUpper(perms);
        const sysRole = String(me?.system_role || "");
        const ownerOrAdmin = isOwnerRole(role) || isSysAdminRole(sysRole);
        canManageStaff = ownerOrAdmin || hasPerm(pset, "STAFF_MANAGE");
        canInviteOwners = ownerOrAdmin;
        if (demoReadonly) { canManageStaff = false; canInviteOwners = false; }
      } catch {
        canManageStaff = false;
        canInviteOwners = false;
      }
      applyInviteAccess();
    }

    function applyInviteAccess() {
      if (!btnInvite || !roleSelect) return;
      btnInvite.classList.toggle("hidden", !canManageStaff);
      btnInvite.disabled = !canManageStaff;
      const ownerOption = roleSelect.querySelector('option[value="OWNER"]');
      if (ownerOption) ownerOption.hidden = !canInviteOwners;
      if (!canInviteOwners && String(roleSelect.value || "STAFF").toUpperCase() === "OWNER") {
        roleSelect.value = "STAFF";
      }
      const inviteCard = document.getElementById("inviteTitle")?.closest('.itemcard');
      const inviteResultEl = document.getElementById("inviteResult");
      if (inviteResultEl) {
        inviteResultEl.textContent = canManageStaff ? "" : "Нет прав на управление участниками.";
      }
      inviteCard?.classList.toggle("hidden", !canManageStaff);
    }

    function syncChannel() {
      const channel = String(inviteChannel.value || "TELEGRAM").toUpperCase();
      tgWrap.classList.toggle("hidden", channel !== "TELEGRAM");
      phoneWrap.classList.toggle("hidden", channel !== "PHONE");
    }

    function setVenueMeta() {
      venueMeta.textContent = venueName ? `${venueName}` : (venueId ? "Заведение выбрано" : "Заведение не выбрано");
      const t = document.getElementById("inviteTitle");
      if (t) t.textContent = venueName ? `Пригласить участника в ${venueName}` : "Пригласить участника";
      openLink.href = venueId ? `/invites.html?venue_id=${encodeURIComponent(venueId)}` : "/invites.html";
    }

    async function ensureVenueName() {
      if (!venueId) { venueName = ""; return; }
      try {
        const v = await getVenueById(venueId);
        venueName = v?.name || "";
      } catch { venueName = ""; }
    }

    async function loadVenuesForSelector() {
      selectorCard.classList.remove("hidden");
      venueSelect.innerHTML = `<option value="">Загружаю заведения…</option>`;
      try {
        const venues = await api("/me/venues");
        window.__lastJson = venues;
        if (!Array.isArray(venues) || venues.length === 0) {
          venueSelect.innerHTML = `<option value="">Нет доступных заведений</option>`;
          return;
        }
        venueSelect.innerHTML = `<option value="">Выберите заведение…</option>`;
        venues.forEach(v => {
          const opt = document.createElement("option");
          opt.value = String(v.id);
          opt.textContent = `${v.name}`;
          if (String(v.id) === String(venueId)) opt.selected = true;
          venueSelect.appendChild(opt);
        });
      } catch (e) {
        venueSelect.innerHTML = `<option value="">Ошибка загрузки заведений</option>`;
        toast("Ошибка загрузки заведений: " + e.message, "err");
      }
    }

    function pendingContact(i) {
      if (i.channel === "PHONE") return esc(i.contact_label || i.phone || "—");
      return '@' + esc(i.tg_username || "—");
    }

    function authChips(methods) {
      const list = Array.isArray(methods) ? methods : [];
      if (!list.length) return '<span class="chip">Способ входа не указан</span>';
      return list.map(m => `<span class="chip">${esc(m === 'phone' ? 'Телефон' : m === 'telegram' ? 'Telegram' : m)}</span>`).join(' ');
    }

    function linkedTargetHtml(i) {
      const target = i?.target_user || null;
      const targetStatus = String(i?.target_status || 'WAITING_SIGNUP').toUpperCase();
      if (!target) return `<div class="muted mt-6"><span class="chip">Ожидает входа</span></div>`;
      const label = target.display_name || target.short_name || target.full_name || (target.tg_username ? '@' + target.tg_username : (target.phone || 'Пользователь'));
      return `<div class="mt-6"><span class="chip">${esc(targetStatus === 'LINKED_USER' ? 'Можно принять' : 'Ожидает входа')}</span> <span class="muted">${esc(label)}</span> ${authChips(target.auth_methods || [])}</div>`;
    }


    function renderPending(items) {
      pending.innerHTML = "";
      if (!items?.length) {
        pending.innerHTML = `<div class="muted">Нет ожидающих приглашений</div>`;
        return;
      }
      items.forEach(i => {
        const row = document.createElement("div");
        row.className = "invite-card";
        row.innerHTML = `
          <div class="row row--between ai-start gap-12">
            <div>
              <div><b>${pendingContact(i)}</b> <span class="chip">${esc(channelLabel(i.channel))}</span> <span class="chip">${esc(roleLabel(i.venue_role))}</span></div>
              <div class="muted mono-wrap mt-6">${i.phone ? esc(i.phone) + ' · ' : ''}${esc(i.created_at || '')}</div>
              ${linkedTargetHtml(i)}
              <div class="mt-6"><a class="link" href="${escAttr(i.invite_link || '#')}" target="_blank" rel="noreferrer">Открыть приглашение</a></div>
            </div>
            <div class="invite-actions">
              <button class="btn" data-copy>Скопировать ссылку</button>
              <button class="btn danger" data-cancel>Отменить</button>
            </div>
          </div>
        `;
        row.querySelector('[data-copy]').onclick = async () => {
          try {
            await navigator.clipboard.writeText(location.origin + (i.invite_link || ''));
            toast('Ссылка скопирована', 'ok');
          } catch {
            toast('Не удалось скопировать ссылку', 'warn');
          }
        };
        const cancelBtn = row.querySelector('[data-cancel]');
        const canCancelInvite = canManageStaff && (canInviteOwners || String(i.venue_role || '').toUpperCase() !== 'OWNER');
        cancelBtn?.classList.toggle('hidden', !canCancelInvite);
        if (cancelBtn) cancelBtn.onclick = async () => {
          try {
            await api(`/venues/${venueId}/invites/${i.id}`, { method:'DELETE' });
            toast('Приглашение отменено', 'ok');
            await loadMembers();
          } catch (e) {
            toast('Ошибка отмены: ' + e.message, 'err');
          }
        };
        pending.appendChild(row);
      });
    }

    function renderMembers(items) {
      members.innerHTML = "";
      if (!items?.length) {
        members.innerHTML = `<div class="muted">Участников пока нет</div>`;
        return;
      }
      items.forEach(m => {
        const row = document.createElement('div');
        row.className = 'invite-card';
        const display = m.display_name || m.short_name || m.full_name || (m.tg_username ? '@' + m.tg_username : 'Участник');
        const canRemoveMember = canManageStaff && (canInviteOwners || String(m.venue_role || '').toUpperCase() !== 'OWNER');
        row.innerHTML = `
          <div class="row row--between ai-start gap-12">
            <div>
              <div><b>${esc(display)}</b> <span class="chip">${esc(roleLabel(m.venue_role))}</span></div>
              <div class="muted mt-6">${m.tg_username ? "@" + esc(String(m.tg_username).replace(/^@+/, "")) : ""}${m.tg_username && m.phone ? " · " : ""}${m.phone ? esc(m.phone) : ""}</div>
              <div class="mt-6">${authChips(m.auth_methods || [])}</div>
            </div>
            <div class="invite-actions">
              <button class="btn danger${canRemoveMember ? '' : ' hidden'}" data-remove>Удалить</button>
            </div>
          </div>
        `;
        const removeBtn = row.querySelector('[data-remove]');
        if (removeBtn) removeBtn.onclick = async () => {
          const ok = confirm(`Удалить ${display} из заведения?`);
          if (!ok) return;
          try {
            await api(`/venues/${venueId}/members/${m.user_id}`, { method:'DELETE' });
            toast('Участник удалён', 'ok');
            await loadMembers();
          } catch (e) {
            toast('Ошибка удаления: ' + e.message, 'err');
          }
        };
        members.appendChild(row);
      });
    }

    if (demoReadonly) {
      const card = document.getElementById('inviteTitle')?.closest('.itemcard');
      if (card && !document.getElementById('demoInvitesNote')) {
        const note = document.createElement('div');
        note.id = 'demoInvitesNote';
        note.className = 'muted mt-6';
        note.textContent = `Пробный режим: приглашения и удаление участников недоступны. Подготовлены данные за ${getDemoMonthLabel(demoState)}.`;
        card.appendChild(note);
      }
    }

    async function loadMembers() {
      if (!venueId) {
        pending.innerHTML = `<div class="muted">Сначала выбери заведение</div>`;
        members.innerHTML = `<div class="muted">Сначала выбери заведение</div>`;
        return;
      }
      await refreshPermissions();
      await ensureVenueName();
      setVenueMeta();
      pending.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
      members.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
      try {
        const data = await api(`/venues/${venueId}/members`);
        window.__lastJson = data;
        renderPending(data.pending_invites || []);
        renderMembers(data.members || []);
      } catch (e) {
        pending.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
        members.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
        toast('Ошибка загрузки: ' + e.message, 'err');
      }
    }

    btnInvite.onclick = async () => {
      if (!canManageStaff) { toast('Нет прав на управление участниками', 'warn'); return; }
      if (!venueId) { toast('Нет заведения — выбери заведение', 'warn'); return; }
      const channel = String(inviteChannel.value || 'TELEGRAM').toUpperCase();
      const role = roleSelect.value;
      const contact_label = document.getElementById('contactLabel').value.trim() || null;
      if (!canInviteOwners && String(role || '').toUpperCase() === 'OWNER') {
        toast('Нет прав на приглашение владельца', 'warn');
        return;
      }
      const body = { invite_channel: channel, venue_role: role, contact_label };
      if (channel === 'TELEGRAM') {
        const tg = document.getElementById('tg').value.trim();
        if (!tg) { toast('Укажи ник в Telegram', 'warn'); return; }
        body.tg_username = tg;
      } else {
        const phone = document.getElementById('phone').value.trim();
        if (!phone) { toast('Введи телефон', 'warn'); return; }
        body.phone = phone;
      }
      inviteResult.textContent = '';
      try {
        const out = await api(`/venues/${venueId}/invites`, { method:'POST', body });
        window.__lastJson = out;
        document.getElementById('tg').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('contactLabel').value = '';
        if (out?.mode === 'member_added' && out?.member) {
          const label = out.member.display_name || out.member.tg_username || out.member.phone || 'Участник';
          inviteResult.innerHTML = `Участник добавлен: <b>${esc(label)}</b> <span class="chip">${esc(roleLabel(out.member.venue_role || role))}</span> <span class="chip">Готово</span>`;
        } else if (out?.invite_link) {
          const pendingHint = String(out?.target_status || 'WAITING_SIGNUP').toUpperCase() === 'LINKED_USER'
            ? 'Приглашение готово к принятию'
            : 'Приглашение создано';
          inviteResult.innerHTML = `${esc(pendingHint)} · <a class="link" href="${escAttr(out.invite_link)}" target="_blank" rel="noreferrer">Открыть приглашение</a>`;
        } else {
          inviteResult.textContent = out?.mode || 'ok';
        }
        toast(out?.mode === 'member_added' ? 'Участник добавлен' : 'Приглашение создано', 'ok');
        await loadMembers();
      } catch (e) {
        toast('Ошибка приглашения: ' + e.message, 'err');
      }
    };

    btnUseVenue.onclick = async () => {
      venueId = venueSelect.value || '';
      if (venueId) {
        setActiveVenueId(venueId);
        const url = new URL(location.href);
        url.searchParams.set('venue_id', venueId);
        history.replaceState(null, '', url.pathname + url.search);
      }
      await loadMembers();
    };

    inviteChannel.onchange = syncChannel;
    syncChannel();
    if (!venueId) await loadVenuesForSelector();
    setVenueMeta();
    await loadMembers();
  </script>
</body>
</html>
