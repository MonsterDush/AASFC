<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Приглашения</title>
  <style>
    .invite-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:10px; margin-top:10px; }
    .invite-card { border-bottom:1px solid var(--border); padding:12px 0; }
    .mono-wrap { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; word-break: break-all; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--border); border-radius:999px; font-size:12px; }
    .invite-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Приглашения и участники</b>
          <div class="muted">hybrid invite: Telegram или телефон</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card">
      <div id="selectorCard" class="itemcard" style="margin-top:12px; display:none;">
        <b>Выбрать заведение</b>
        <div class="muted mt-6">Страница открыта без <span class="mono">venue_id</span>. Выбери заведение.</div>
        <div class="row mt-10">
          <select id="venueSelect" style="min-width:260px; max-width:100%"></select>
          <button class="btn primary" id="btnUseVenue">Выбрать</button>
          <a class="link" id="openLink" href="/invites.html">Открыть ссылку →</a>
        </div>
      </div>

      <div class="itemcard mt-12">
        <b id="inviteTitle">Пригласить участника</b>
        <div id="venueMeta" class="muted mono mt-6"></div>

        <div class="invite-grid">
          <div>
            <label class="muted">Канал</label>
            <select id="inviteChannel">
              <option value="TELEGRAM">Telegram</option>
              <option value="PHONE">Телефон</option>
            </select>
          </div>
          <div id="tgWrap">
            <label class="muted">Telegram username</label>
            <input id="tg" placeholder="@username" />
          </div>
          <div id="phoneWrap" style="display:none">
            <label class="muted">Телефон</label>
            <input id="phone" placeholder="+7 999 123-45-67" />
          </div>
          <div>
            <label class="muted">Имя/заметка</label>
            <input id="contactLabel" placeholder="Иван / Новый кальянщик" />
          </div>
          <div>
            <label class="muted">Роль</label>
            <select id="role">
              <option value="STAFF">Персонал</option>
              <option value="OWNER">Владелец</option>
            </select>
          </div>
        </div>
        <div class="row mt-10">
          <button class="btn primary" id="btnInvite">Создать приглашение</button>
          <div id="inviteResult" class="muted"></div>
        </div>
      </div>

      <div class="itemcard mt-12">
        <b>Приглашения в ожидании</b>
        <div id="pending" class="mt-10"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>

      <div class="itemcard mt-12">
        <b>Участники</b>
        <div id="members" class="mt-10"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">JSON</div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="nav"><div class="wrap"><div id="nav"></div></div></div>

  <script type="module">
    import {
      applyTelegramTheme,
      ensureLogin,
      api,
      toast,
      mountCommonUI,
      setActiveVenueId,
      getActiveVenueId,
      mountNav,
      getVenueById
    } from "/app.js";

    function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }

    applyTelegramTheme();
    mountCommonUI("invites");
    await ensureLogin({ silent:true });
    await mountNav({ activeTab: "none" });

    const params = new URLSearchParams(location.search);
    let venueId = params.get("venue_id") || getActiveVenueId();
    let venueName = "";

    if (venueId) setActiveVenueId(venueId);

    const selectorCard = document.getElementById("selectorCard");
    const venueSelect = document.getElementById("venueSelect");
    const btnUseVenue = document.getElementById("btnUseVenue");
    const openLink = document.getElementById("openLink");
    const venueMeta = document.getElementById("venueMeta");
    const pending = document.getElementById("pending");
    const members = document.getElementById("members");
    const inviteResult = document.getElementById("inviteResult");
    const inviteChannel = document.getElementById("inviteChannel");
    const tgWrap = document.getElementById("tgWrap");
    const phoneWrap = document.getElementById("phoneWrap");

    function syncChannel() {
      const channel = String(inviteChannel.value || "TELEGRAM").toUpperCase();
      tgWrap.style.display = channel === "TELEGRAM" ? "" : "none";
      phoneWrap.style.display = channel === "PHONE" ? "" : "none";
    }

    function setVenueMeta() {
      venueMeta.textContent = venueId ? `venue_id=${venueId}` : "Заведение не выбрано";
      const t = document.getElementById("inviteTitle");
      if (t) t.textContent = venueName ? `Пригласить участника в ${venueName}` : "Пригласить участника";
      openLink.href = venueId ? `/invites.html?venue_id=${encodeURIComponent(venueId)}` : "/invites.html";
    }

    async function ensureVenueName() {
      if (!venueId) { venueName = ""; return; }
      try {
        const v = await getVenueById(venueId);
        venueName = v?.name || "";
      } catch { venueName = ""; }
    }

    async function loadVenuesForSelector() {
      selectorCard.style.display = "block";
      venueSelect.innerHTML = `<option value="">Загружаю заведения…</option>`;
      try {
        const venues = await api("/me/venues");
        window.__lastJson = venues;
        if (!Array.isArray(venues) || venues.length === 0) {
          venueSelect.innerHTML = `<option value="">Нет доступных заведений</option>`;
          return;
        }
        venueSelect.innerHTML = `<option value="">Выберите заведение…</option>`;
        venues.forEach(v => {
          const opt = document.createElement("option");
          opt.value = String(v.id);
          opt.textContent = `${v.name} (id=${v.id})`;
          if (String(v.id) === String(venueId)) opt.selected = true;
          venueSelect.appendChild(opt);
        });
      } catch (e) {
        venueSelect.innerHTML = `<option value="">Ошибка загрузки заведений</option>`;
        toast("Ошибка загрузки заведений: " + e.message, "err");
      }
    }

    function pendingContact(i) {
      if (i.channel === "PHONE") return esc(i.contact_label || i.phone || "—");
      return '@' + esc(i.tg_username || "—");
    }

    function renderPending(items) {
      pending.innerHTML = "";
      if (!items?.length) {
        pending.innerHTML = `<div class="muted">Нет ожидающих приглашений</div>`;
        return;
      }
      items.forEach(i => {
        const row = document.createElement("div");
        row.className = "invite-card";
        row.innerHTML = `
          <div class="row" style="justify-content:space-between; align-items:flex-start; gap:12px;">
            <div>
              <div><b>${pendingContact(i)}</b> <span class="chip">${esc(i.channel || 'TELEGRAM')}</span> <span class="chip">${esc(i.venue_role)}</span></div>
              <div class="muted mono-wrap mt-6">${i.phone ? esc(i.phone) + ' · ' : ''}${esc(i.created_at || '')}</div>
              <div class="mono-wrap mt-6"><a class="link" href="${escAttr(i.invite_link || '#')}" target="_blank" rel="noreferrer">${esc(i.invite_link || '')}</a></div>
            </div>
            <div class="invite-actions">
              <button class="btn" data-copy>Скопировать ссылку</button>
              <button class="btn danger" data-cancel>Отменить</button>
            </div>
          </div>
        `;
        row.querySelector('[data-copy]').onclick = async () => {
          try {
            await navigator.clipboard.writeText(location.origin + (i.invite_link || ''));
            toast('Ссылка скопирована', 'ok');
          } catch {
            toast('Не удалось скопировать ссылку', 'warn');
          }
        };
        row.querySelector('[data-cancel]').onclick = async () => {
          try {
            await api(`/venues/${venueId}/invites/${i.id}`, { method:'DELETE' });
            toast('Приглашение отменено', 'ok');
            await loadMembers();
          } catch (e) {
            toast('Ошибка отмены: ' + e.message, 'err');
          }
        };
        pending.appendChild(row);
      });
    }

    function renderMembers(items) {
      members.innerHTML = "";
      if (!items?.length) {
        members.innerHTML = `<div class="muted">Участников пока нет</div>`;
        return;
      }
      items.forEach(m => {
        const row = document.createElement('div');
        row.className = 'invite-card';
        row.innerHTML = `
          <div>
            <div><b>${esc(m.short_name || m.full_name || (m.tg_username ? '@' + m.tg_username : 'user #' + m.user_id))}</b> <span class="chip">${esc(m.venue_role)}</span></div>
            <div class="muted mono-wrap mt-6">user_id=${esc(m.user_id)} · tg=${esc(m.tg_username || '-')}</div>
          </div>
        `;
        members.appendChild(row);
      });
    }

    async function loadMembers() {
      if (!venueId) {
        pending.innerHTML = `<div class="muted">Нужен venue_id</div>`;
        members.innerHTML = `<div class="muted">Нужен venue_id</div>`;
        return;
      }
      await ensureVenueName();
      setVenueMeta();
      pending.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
      members.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
      try {
        const data = await api(`/venues/${venueId}/members`);
        window.__lastJson = data;
        renderPending(data.pending_invites || []);
        renderMembers(data.members || []);
      } catch (e) {
        pending.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
        members.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
        toast('Ошибка загрузки: ' + e.message, 'err');
      }
    }

    document.getElementById('btnInvite').onclick = async () => {
      if (!venueId) { toast('Нет заведения — выбери заведение', 'warn'); return; }
      const channel = String(inviteChannel.value || 'TELEGRAM').toUpperCase();
      const role = document.getElementById('role').value;
      const contact_label = document.getElementById('contactLabel').value.trim() || null;
      const body = { invite_channel: channel, venue_role: role, contact_label };
      if (channel === 'TELEGRAM') {
        const tg = document.getElementById('tg').value.trim();
        if (!tg) { toast('Введи username', 'warn'); return; }
        body.tg_username = tg;
      } else {
        const phone = document.getElementById('phone').value.trim();
        if (!phone) { toast('Введи телефон', 'warn'); return; }
        body.phone = phone;
      }
      inviteResult.textContent = '';
      try {
        const out = await api(`/venues/${venueId}/invites`, { method:'POST', body });
        window.__lastJson = out;
        document.getElementById('tg').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('contactLabel').value = '';
        inviteResult.innerHTML = out?.invite_link
          ? `Ссылка: <a class="link" href="${escAttr(out.invite_link)}" target="_blank" rel="noreferrer">${esc(out.invite_link)}</a>`
          : (out?.mode || 'ok');
        toast(out?.mode === 'member_added' ? 'Участник добавлен' : 'Приглашение создано', 'ok');
        await loadMembers();
      } catch (e) {
        toast('Ошибка приглашения: ' + e.message, 'err');
      }
    };

    btnUseVenue.onclick = async () => {
      venueId = venueSelect.value || '';
      if (venueId) {
        setActiveVenueId(venueId);
        const url = new URL(location.href);
        url.searchParams.set('venue_id', venueId);
        history.replaceState(null, '', url.pathname + url.search);
      }
      await loadMembers();
    };

    inviteChannel.onchange = syncChannel;
    syncChannel();
    if (!venueId) await loadVenuesForSelector();
    setVenueMeta();
    await loadMembers();
  </script>
</body>
</html>
