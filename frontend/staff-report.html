<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260723-polish1" />
  <link rel="stylesheet" href="/styles/pages/staff-report.css?v=20260720-unified7" />
  <script src="/page-loader.js?v=20260720-loader1"></script>
  <title>Axelio · Отчёты</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Отчёты</b>
          <div class="muted" id="subtitle">отчёты по сменам и дням</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card">
      <div class="row row--between">
        <div class="row ai-center gap-10 month-controls">
          <button class="btn" id="monthPrev">◀</button>
          <b id="monthLabel">…</b>
          <button class="btn" id="monthNext">▶</button>
        </div>
          <div class="row ai-center gap-10 row--end">
            <div id="reportSlotToggle" class="shift-toggle hidden" aria-label="Слот отчёта">
              <button type="button" id="reportSlotDay">День</button>
              <button type="button" id="reportSlotNight">Ночь</button>
            </div>
            <div class="muted small">Нажмите на день, чтобы открыть или заполнить отчёт</div>
          </div>
        </div>
        <div class="report-legend mt-10">
          <div class="report-legend__item"><span class="report-legend__swatch report-legend__swatch--closed"></span><span>Закрытая смена</span></div>
          <div class="report-legend__item"><span class="report-legend__swatch report-legend__swatch--draft"></span><span>Черновое закрытие</span></div>
          <div class="report-legend__item"><span class="report-legend__swatch report-legend__swatch--overdue"></span><span>Прошедший день без закрытия</span></div>
        </div>
        <div id="calGrid" class="cal mt-10"></div>
      </div>
    </div>
    <div class="nav">
      <div class="wrap">
        <div id="nav"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>

  <div class="modal" id="modal">
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <div class="modal__head">
          <div>
            <b class="modal__title">Отчет</b>
            <div class="modal__subtitle" id="modalSubtitle"></div>
          </div>
          <button class="btn" data-close>Закрыть</button>
        </div>

        <div class="modal__body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/staff-report.js?v=20260720-unified6"></script>

  <div class="modal" id="photoModal">
      <div class="modal__backdrop" data-close-ph></div>
      <div class="modal__panel modal__panel--wide">
        <div class="modal__head">
          <div class="minw-0">
            <b class="modal__title" id="photoTitle">Фото</b>
            <div class="modal__subtitle" id="photoSubtitle"></div>
          </div>
          <button class="btn" data-close-ph>Закрыть</button>
        </div>
        <div class="modal__body">
          <div class="row gap-8 row--between">
            <div class="row ai-center gap-8">
              <button class="btn" id="phPrev">◀</button>
              <button class="btn" id="phNext">▶</button>
              <div class="muted" id="phCounter"></div>
            </div>
            <div class="row ai-center gap-8">
              <a class="btn" id="phDownload" href="#" download>Скачать</a>
              <button class="btn danger" id="phDelete">Удалить</button>
            </div>
          </div>
          <div class="photoStage mt-10">
            <img id="phImg" alt="photo" class="photoStage__img"/>
          </div>
        </div>
      </div>
  </div>

</body>
</html>
