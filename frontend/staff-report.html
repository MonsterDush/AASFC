<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260802-navbuttons1" />
  <link rel="stylesheet" href="/styles/pages/staff-report.css?v=20260728-responsive1" />
  <script src="/page-loader.js?v=20260802-navbuttons1"></script>
  <title>Axelio · Отчёты</title>
</head>
<body class="staff-report-page">
  <div class="container staff-report-shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Отчёты</b>
          <div class="muted" id="subtitle">отчёты по сменам и дням</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <main class="staff-report-content">
    <section class="card section-card staff-report-calendar-card">
      <div class="staff-report-toolbar">
        <div class="staff-report-month month-controls">
          <button class="btn staff-report-month-button" id="monthPrev" aria-label="Предыдущий месяц">◀</button>
          <b id="monthLabel">…</b>
          <button class="btn staff-report-month-button" id="monthNext" aria-label="Следующий месяц">▶</button>
        </div>
        <div class="staff-report-toolbar__aside">
          <div id="reportSlotToggle" class="shift-toggle hidden" aria-label="Слот отчёта">
            <button type="button" id="reportSlotDay">День</button>
            <button type="button" id="reportSlotNight">Ночь</button>
          </div>
          <div class="muted small staff-report-hint">
            <span class="staff-report-label-wide">Нажмите на день, чтобы открыть или заполнить отчёт</span>
            <span class="staff-report-label-compact">Выберите день</span>
          </div>
        </div>
      </div>

      <div class="report-legend staff-report-legend">
        <div class="report-legend__item">
          <span class="report-legend__swatch report-legend__swatch--closed"></span>
          <span class="staff-report-label-wide">Закрытая смена</span>
          <span class="staff-report-label-compact">Закрыт</span>
        </div>
        <div class="report-legend__item">
          <span class="report-legend__swatch report-legend__swatch--draft"></span>
          <span class="staff-report-label-wide">Черновое закрытие</span>
          <span class="staff-report-label-compact">Черновик</span>
        </div>
        <div class="report-legend__item">
          <span class="report-legend__swatch report-legend__swatch--overdue"></span>
          <span class="staff-report-label-wide">Прошедший день без закрытия</span>
          <span class="staff-report-label-compact">Не закрыт</span>
        </div>
      </div>
      <div id="calGrid" class="cal staff-report-calendar" aria-live="polite">
        <div class="report-loading-skeleton skeleton"></div>
      </div>
    </section>
    </main>

    <div class="nav">
      <div class="wrap">
        <div id="nav"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>

  <div class="modal" id="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div>
          <b class="modal__title">Отчёт</b>
          <div class="modal__subtitle" id="modalSubtitle"></div>
        </div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="modal" id="photoModal">
    <div class="modal__backdrop" data-close-ph></div>
    <div class="modal__panel modal__panel--wide">
      <div class="modal__head">
        <div class="minw-0">
          <b class="modal__title" id="photoTitle">Фото</b>
          <div class="modal__subtitle" id="photoSubtitle"></div>
        </div>
        <button class="btn" data-close-ph>Закрыть</button>
      </div>
      <div class="modal__body">
        <div class="staff-report-photo-actions">
          <div class="row ai-center gap-8">
            <button class="btn" id="phPrev">◀</button>
            <button class="btn" id="phNext">▶</button>
            <div class="muted" id="phCounter"></div>
          </div>
          <div class="row ai-center gap-8">
            <a class="btn" id="phDownload" href="#" download>Скачать</a>
            <button class="btn danger" id="phDelete">Удалить</button>
          </div>
        </div>
        <div class="photoStage mt-10">
          <img id="phImg" alt="photo" class="photoStage__img"/>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/staff-report.js?v=20260802-ledgerdrill1"></script>
</body>
</html>
