<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260722-split1" />
  <link rel="stylesheet" href="/styles/pages/invites.css?v=20260720-unified7" />
  <script src="/page-loader.js?v=20260720-loader1"></script>
  <title>Axelio · Админ · Приглашения</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Админ · Приглашения</b>
          <div class="muted">приглашения и участники</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card">
      <div class="itemcard mt-12">
        <b>Выберите заведение</b>
        <div class="row mt-10">
          <select class="invite-venue-select" id="venueSelect"></select>
          <button class="btn primary" id="btnUseVenue">Выбрать</button>
        </div>
        <div class="muted" id="venueMeta"></div>
      </div>

      <div class="itemcard mt-12">
        <b>Создать приглашение</b>
        <div class="invite-grid">
          <div>
            <label class="muted">Способ приглашения</label>
            <select id="inviteChannel">
              <option value="TELEGRAM">Telegram</option>
              <option value="PHONE">Телефон</option>
            </select>
          </div>
          <div id="tgWrap">
            <label class="muted">Ник в Telegram</label>
            <input id="tg" placeholder="@username" />
          </div>
          <div class="hidden" id="phoneWrap">
            <label class="muted">Телефон</label>
            <input id="phone" placeholder="+7 999 123-45-67" />
          </div>
          <div>
            <label class="muted">Имя или заметка</label>
            <input id="contactLabel" placeholder="Иван / Бармен" />
          </div>
          <div>
            <label class="muted">Роль</label>
            <select id="role">
              <option value="STAFF">Персонал</option>
              <option value="OWNER">Владелец</option>
            </select>
          </div>
        </div>
        <div class="row mt-10">
          <button class="btn primary" id="btnInvite">Создать</button>
          <div id="inviteResult" class="muted"></div>
        </div>
      </div>

      <div class="itemcard mt-12">
        <b>Приглашения в ожидании</b>
        <div id="pending" class="mt-10"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>
      <div class="itemcard mt-12">
        <b>Участники</b>
        <div id="members" class="mt-10"><div class="skeleton"></div><div class="skeleton"></div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal"><div class="modal__backdrop"></div><div class="modal__panel"><div class="modal__head"><div class="modal__title">Подтверждение</div><button class="btn" data-close>Закрыть</button></div><div class="modal__body"></div></div></div>
  <div class="nav"><div class="wrap"><div id="nav"></div></div></div>

  <script type="module">
    import { applyTelegramTheme, ensureLogin, api, toast, mountCommonUI, confirmModal, mountNav } from "/app.js?v=20260722-dynamic1";
    function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }
    function roleLabel(role){ return String(role || '').toUpperCase() === 'OWNER' ? 'Владелец' : 'Персонал'; }
    function channelLabel(channel){ return String(channel || '').toUpperCase() === 'PHONE' ? 'Телефон' : 'Telegram'; }

    applyTelegramTheme();
    mountCommonUI('admin-invites');
    await ensureLogin({ silent:true });
    await mountNav({ activeTab: 'admin-invites' });

    let venueId = new URLSearchParams(location.search).get('venue_id') || '';
    const venueSelect = document.getElementById('venueSelect');
    const venueMeta = document.getElementById('venueMeta');
    const pending = document.getElementById('pending');
    const members = document.getElementById('members');
    const inviteChannel = document.getElementById('inviteChannel');
    const tgWrap = document.getElementById('tgWrap');
    const phoneWrap = document.getElementById('phoneWrap');
    const inviteResult = document.getElementById('inviteResult');

    function syncChannel(){
      const channel = String(inviteChannel.value || 'TELEGRAM').toUpperCase();
      tgWrap.classList.toggle('hidden', channel !== 'TELEGRAM');
      phoneWrap.classList.toggle('hidden', channel !== 'PHONE');
    }
    function setVenueMeta(){
      const selected = venueSelect.options[venueSelect.selectedIndex]?.textContent || '';
      venueMeta.textContent = selected ? `${selected}` : (venueId ? 'Заведение выбрано' : 'Заведение не выбрано');
    }

    function authChips(methods) {
      const list = Array.isArray(methods) ? methods : [];
      if (!list.length) return '<span class="chip">Способ входа не указан</span>';
      return list.map(m => `<span class="chip">${esc(m === 'phone' ? 'Телефон' : m === 'telegram' ? 'Telegram' : m)}</span>`).join(' ');
    }

    function linkedTargetHtml(i) {
      const target = i?.target_user || null;
      const targetStatus = String(i?.target_status || 'WAITING_SIGNUP').toUpperCase();
      if (!target) return `<div class="muted mt-6"><span class="chip">Ожидает входа</span></div>`;
      const label = target.display_name || target.short_name || target.full_name || (target.tg_username ? '@' + target.tg_username : (target.phone || 'Пользователь'));
      return `<div class="mt-6"><span class="chip">${esc(targetStatus === 'LINKED_USER' ? 'Можно принять' : 'Ожидает входа')}</span> <span class="muted">${esc(label)}</span> ${authChips(target.auth_methods || [])}</div>`;
    }


    async function loadVenues() {
      venueSelect.innerHTML = `<option value="">Загружаю заведения…</option>`;
      try {
        const data = await api('/venues?include_archived=true');
        window.__lastJson = data;
        venueSelect.innerHTML = `<option value="">Выберите заведение…</option>`;
        data.forEach(v => {
          const opt = document.createElement('option');
          opt.value = String(v.id);
          opt.textContent = `${v.name}${v.is_archived ? " · архив" : ""}`;
          if (String(v.id) === String(venueId)) opt.selected = true;
          venueSelect.appendChild(opt);
        });
      } catch (e) {
        venueSelect.innerHTML = `<option value="">Ошибка: ${esc(e.message)}</option>`;
        toast('Ошибка загрузки заведений: ' + e.message, 'err');
      }
    }

    function renderPending(items) {
      pending.innerHTML = '';
      if (!items?.length) { pending.innerHTML = `<div class="muted">Нет приглашений</div>`; return; }
      items.forEach(i => {
        const contact = i.channel === 'PHONE' ? (i.contact_label || i.phone || '—') : '@' + (i.tg_username || '—');
        const row = document.createElement('div');
        row.className = 'invite-card';
        row.innerHTML = `
          <div class="row row--between ai-start gap-12">
            <div>
              <div><b>${esc(contact)}</b> <span class="chip">${esc(channelLabel(i.channel))}</span> <span class="chip">${esc(roleLabel(i.venue_role))}</span></div>
              <div class="muted mono-wrap mt-6">${i.phone ? esc(i.phone) + ' · ' : ''}${esc(i.created_at || '')}</div>
              ${linkedTargetHtml(i)}
              <div class="mt-6"><a class="link" href="${escAttr(i.invite_link || '#')}" target="_blank" rel="noreferrer">Открыть приглашение</a></div>
            </div>
            <div class="row gap-8">
              <button class="btn" data-copy>Скопировать ссылку</button>
              <button class="btn danger" data-cancel>Отменить</button>
            </div>
          </div>
        `;
        row.querySelector('[data-copy]').onclick = async () => {
          try { await navigator.clipboard.writeText(location.origin + (i.invite_link || '')); toast('Ссылка скопирована', 'ok'); }
          catch { toast('Не удалось скопировать', 'warn'); }
        };
        row.querySelector('[data-cancel]').onclick = async () => {
          const ok = await confirmModal({ title:'Отменить приглашение?', text:`Отменить приглашение для ${contact}?`, confirmText:'Отменить', danger:true });
          if (!ok) return;
          try { await api(`/venues/${venueId}/invites/${i.id}`, { method:'DELETE' }); toast('Приглашение отменено', 'ok'); await loadMembers(); }
          catch (e) { toast('Ошибка отмены: ' + e.message, 'err'); }
        };
        pending.appendChild(row);
      });
    }

    function renderMembers(items) {
      members.innerHTML = '';
      if (!items?.length) { members.innerHTML = `<div class="muted">Нет участников</div>`; return; }
      items.forEach(m => {
        const row = document.createElement('div');
        row.className = 'invite-card';
        const display = m.display_name || m.short_name || m.full_name || (m.tg_username ? '@' + m.tg_username : 'Участник');
        row.innerHTML = `<div><b>${esc(display)}</b> <span class="chip">${esc(m.venue_role === "OWNER" ? "Владелец" : "Персонал")}</span><div class="muted mt-6">${m.tg_username ? "@" + esc(String(m.tg_username).replace(/^@+/, "")) : ""}${m.tg_username && m.phone ? " · " : ""}${m.phone ? esc(m.phone) : ""}</div><div class="mt-6">${authChips(m.auth_methods || [])}</div></div>`;
        members.appendChild(row);
      });
    }

    async function loadMembers() {
      if (!venueId) { pending.innerHTML = `<div class="muted">Выберите заведение</div>`; members.innerHTML = `<div class="muted">Выберите заведение</div>`; return; }
      pending.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
      members.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
      try {
        const data = await api(`/venues/${venueId}/members`);
        window.__lastJson = data;
        renderPending(data.pending_invites || []);
        renderMembers(data.members || []);
      } catch (e) {
        pending.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
        members.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
        toast('Ошибка загрузки участников: ' + e.message, 'err');
      }
    }

    document.getElementById('btnUseVenue').onclick = async () => {
      venueId = venueSelect.value || '';
      setVenueMeta();
      const url = new URL(location.href);
      if (venueId) url.searchParams.set('venue_id', venueId); else url.searchParams.delete('venue_id');
      history.replaceState(null, '', url.pathname + url.search);
      await loadMembers();
    };

    document.getElementById('btnInvite').onclick = async () => {
      if (!venueId) return toast('Сначала выберите заведение', 'warn');
      const channel = String(inviteChannel.value || 'TELEGRAM').toUpperCase();
      const role = document.getElementById('role').value;
      const contact_label = document.getElementById('contactLabel').value.trim() || null;
      const body = { invite_channel: channel, venue_role: role, contact_label };
      if (channel === 'TELEGRAM') {
        const tg = document.getElementById('tg').value.trim();
        if (!tg) return toast('Укажи ник в Telegram', 'warn');
        body.tg_username = tg;
      } else {
        const phone = document.getElementById('phone').value.trim();
        if (!phone) return toast('Введите телефон', 'warn');
        body.phone = phone;
      }
      try {
        const out = await api(`/venues/${venueId}/invites`, { method:'POST', body });
        if (out?.mode === 'member_added' && out?.member) {
          const label = out.member.display_name || out.member.tg_username || out.member.phone || 'Участник';
          inviteResult.innerHTML = `Участник добавлен: <b>${esc(label)}</b> <span class="chip">${esc(roleLabel(out.member.venue_role || role))}</span> <span class="chip">Готово</span>`;
        } else if (out?.invite_link) {
          const pendingHint = String(out?.target_status || 'WAITING_SIGNUP').toUpperCase() === 'LINKED_USER'
            ? 'Приглашение готово к принятию'
            : 'Приглашение создано';
          inviteResult.innerHTML = `${esc(pendingHint)} · <a class="link" href="${escAttr(out.invite_link)}" target="_blank" rel="noreferrer">Открыть приглашение</a>`;
        } else {
          inviteResult.textContent = 'Готово';
        }
        document.getElementById('tg').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('contactLabel').value = '';
        toast(out?.mode === 'member_added' ? 'Участник добавлен' : 'Приглашение отправлено', 'ok');
        await loadMembers();
      } catch (e) { toast('Ошибка приглашения: ' + e.message, 'err'); }
    };

    inviteChannel.onchange = syncChannel;
    syncChannel();
    await loadVenues();
    setVenueMeta();
    await loadMembers();
  </script>
</body>
</html>
