<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Мои заведения</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Мои заведения</b>
          <div class="muted">выберите заведение</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card">
      <div class="muted">
        Открой нужное заведение.
      </div>

      <div id="list" class="list"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Данные</div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="nav">
    <div class="wrap">
      <div id="nav"></div>
    </div>
  </div>

  <script type="module">
import { applyTelegramTheme, ensureLogin, api, toast, mountCommonUI, setActiveVenueId, mountNav } from "/app.js";

applyTelegramTheme();
mountCommonUI("app");

await mountNav({ activeTab: "none" });

const list = document.getElementById("list");
function esc(s){ return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

function venueCard(v){
  const archived = !!v.is_archived;
  const chip = archived ? '<span class="badge" style="margin-left:8px">архив</span>' : '';
  const hint = archived
    ? '<div class="small" style="margin-top:6px">Заведение сейчас не активно. Доступно только владельцу.</div>'
    : '';
  const href = v.open_target || `/staff-shifts.html?venue_id=${encodeURIComponent(v.id)}`;
  return `
    <div class="itemcard">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div style="min-width:0;flex:1 1 auto;">
          <b>${esc(v.name)}${chip}</b>
          <div class="small">${v.my_role ? esc(String(v.my_role).toUpperCase() === "OWNER" ? "Владелец" : "Персонал") : ""}</div>
          ${hint}
        </div>
        <a class="btn subtle inline" href="${href}" data-open data-id="${v.id}">Открыть</a>
      </div>
    </div>
  `;
}

function renderSections(data){
  const active = (data || []).filter((v) => !v.is_archived);
  const archived = (data || []).filter((v) => !!v.is_archived);
  if (!active.length && !archived.length) {
    list.innerHTML = `<div class="muted">Пока нет заведений</div>`;
    return;
  }
  let html = '';
  if (active.length) {
    html += `
      <div class="section-head" style="margin-top:6px"><div class="section-title"><b>Активные заведения</b></div></div>
      <div class="list">${active.map(venueCard).join('')}</div>
    `;
  }
  if (archived.length) {
    html += `
      <div class="section-head" style="margin-top:14px"><div class="section-title"><b>Архив</b></div><div class="small">Архивные заведения доступны только владельцу.</div></div>
      <div class="list">${archived.map(venueCard).join('')}</div>
    `;
  }
  list.innerHTML = html;
  list.querySelectorAll('[data-open]').forEach((el) => {
    el.onclick = (e) => {
      e.preventDefault();
      const id = el.getAttribute('data-id');
      if (id) setActiveVenueId(id);
      location.href = el.getAttribute('href') || '/app-venues.html';
    };
  });
}

async function load(){
  list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
  try{
    const data = await api("/me/venues?include_archived=true");
    window.__lastJson = data;
    renderSections(Array.isArray(data) ? data : []);
  }catch(e){
    list.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
    toast("Ошибка загрузки: " + e.message, "err");
  }
}

(async () => {
  const ok = await ensureLogin({ silent:true });
  if (!ok.ok) return;
  await load();
})();
</script>
</body>
</html>
