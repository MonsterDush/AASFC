<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Мои заведения</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Мои заведения</b>
          <div class="muted">выберите заведение</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="section-head" style="align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div>
          <div class="section-title"><b>Заведения</b></div>
          <div class="muted" style="margin-top:6px">Открой нужное заведение или создай новое.</div>
        </div>
        <button id="openCreateVenueModalBtn" class="btn" type="button">Создать заведение</button>
      </div>

      <div id="list" class="list" style="margin-top:12px"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Данные</div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="nav">
    <div class="wrap">
      <div id="nav"></div>
    </div>
  </div>

  <script type="module">
import { applyTelegramTheme, ensureLogin, api, toast, mountCommonUI, setActiveVenueId, mountNav } from "/app.js";
import { getBillingAccessMode, getBillingStatus, getSetupActionLabel, getSetupProgress, getSetupResumeStep, getSetupStatus, isOwnerRole, isSetupDone, isSetupPrepareDone } from "/permissions.js?v=20260409-setup5";

applyTelegramTheme();
mountCommonUI("app");

await mountNav({ activeTab: "none" });

const list = document.getElementById("list");
const openCreateVenueModalBtn = document.getElementById("openCreateVenueModalBtn");
const modal = document.getElementById("modal");
const modalTitle = modal?.querySelector(".modal__title");
const modalBody = modal?.querySelector(".modal__body");
const modalCloseBtn = modal?.querySelector("[data-close]");
const modalBackdrop = modal?.querySelector(".modal__backdrop");

function openModal(title, bodyHtml){
  if (!modal || !modalTitle || !modalBody) return;
  modalTitle.textContent = title || "Данные";
  modalBody.innerHTML = bodyHtml || "";
  modal.classList.add("open");
}

function closeModal(){
  if (!modal || !modalBody) return;
  modal.classList.remove("open");
  modalBody.innerHTML = "";
}

modalCloseBtn?.addEventListener("click", closeModal);
modalBackdrop?.addEventListener("click", closeModal);

function setCreateBusy(isBusy){
  const btn = document.getElementById("modalCreateVenueBtn");
  const cancelBtn = document.getElementById("modalCancelCreateVenueBtn");
  const input = document.getElementById("modalNewVenueName");
  if (btn) {
    btn.disabled = !!isBusy;
    btn.textContent = isBusy ? "Создаём…" : "Создать заведение";
  }
  if (cancelBtn) cancelBtn.disabled = !!isBusy;
  if (input) input.disabled = !!isBusy;
}

async function submitCreateVenue(){
  const input = document.getElementById("modalNewVenueName");
  const hint = document.getElementById("modalCreateVenueHint");
  const name = String(input?.value || "").trim();
  if (!name) {
    toast("Укажите название заведения", "err");
    input?.focus();
    return;
  }
  setCreateBusy(true);
  if (hint) hint.textContent = "Создаём заведение и проверяем, доступен ли trial…";
  try {
    const result = await api("/venues/self-service", { method: "POST", body: { name } });
    if (result?.id) setActiveVenueId(result.id);
    if (result?.trial_granted) {
      toast("Заведение создано. Пробный доступ на 3 дня включён.");
    } else {
      toast("Заведение создано. Для работы нужно продлить доступ.");
    }
    const target = result?.next_url || result?.open_target || (result?.id ? `/app-venue.html?venue_id=${encodeURIComponent(result.id)}` : "/app-venues.html");
    location.href = target;
  } catch (e) {
    if (hint) hint.textContent = "Не получилось создать заведение. Проверь название и попробуй ещё раз.";
    toast("Ошибка создания: " + (e?.message || e), "err");
  } finally {
    setCreateBusy(false);
  }
}

function openCreateVenueModal(){
  openModal("Создать заведение", `
    <form id="createVenueForm">
      <div class="muted">
        Первое заведение получит 3 дня полного пробного доступа. Последующие создаются без trial — рабочие функции откроются после продления доступа.
      </div>
      <label style="display:block;margin-top:12px">
        <span class="small">Название заведения</span>
        <input id="modalNewVenueName" type="text" maxlength="200" placeholder="Например, Hookah Place" autocomplete="off" style="margin-top:8px" />
      </label>
      <div id="modalCreateVenueHint" class="small" style="margin-top:8px">
        После создания мы перенаправим тебя: с trial — в быструю настройку, без trial — на страницу заведения и оплаты.
      </div>
      <div class="row gap-8" style="margin-top:14px;justify-content:flex-end;flex-wrap:wrap">
        <button id="modalCancelCreateVenueBtn" class="btn subtle" type="button">Отмена</button>
        <button id="modalCreateVenueBtn" class="btn" type="submit">Создать заведение</button>
      </div>
    </form>
  `);
  const form = document.getElementById("createVenueForm");
  const input = document.getElementById("modalNewVenueName");
  document.getElementById("modalCancelCreateVenueBtn")?.addEventListener("click", closeModal);
  form?.addEventListener("submit", (e) => {
    e.preventDefault();
    submitCreateVenue();
  });
  setTimeout(() => input?.focus(), 0);
}

openCreateVenueModalBtn?.addEventListener("click", openCreateVenueModal);

function esc(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function formatDateTime(value){
  if (!value) return "—";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString("ru-RU");
}

function billingChip(v){
  const status = getBillingStatus(v);
  const isTrial = !!v?.is_trial || String(v?.billing_kind || "").toUpperCase() === "TRIAL";
  if (isTrial && status === "ACTIVE") return '<span class="badge" style="margin-left:8px">trial</span>';
  if (status === "GRACE") return '<span class="badge" style="margin-left:8px">grace</span>';
  if (status === "SUSPENDED") return '<span class="badge" style="margin-left:8px">доступ ограничен</span>';
  return '';
}

function billingHint(v){
  const status = getBillingStatus(v);
  const isTrial = !!v?.is_trial || String(v?.billing_kind || "").toUpperCase() === "TRIAL";
  const trialUntil = v?.trial_until || (isTrial ? v?.paid_until : null);
  const paidUntil = v?.paid_until ? `Оплачено до ${esc(formatDateTime(v.paid_until))}` : 'Срок оплаты не задан';
  const graceUntil = v?.grace_until ? `Льготный период до ${esc(formatDateTime(v.grace_until))}` : '';
  const reason = v?.billing_restricted_reason ? esc(v.billing_restricted_reason) : '';

  if (isTrial && status === "ACTIVE") {
    const label = trialUntil ? `Пробный доступ до ${esc(formatDateTime(trialUntil))}` : 'Пробный доступ активен';
    return `<div class="small" style="margin-top:6px">${label}. После окончания trial заведение перейдёт в grace до оплаты.</div>`;
  }
  if (status === "GRACE") {
    return `<div class="small" style="margin-top:6px">${paidUntil}. ${graceUntil || 'Доступ ограничится после окончания льготного периода.'}</div>`;
  }
  if (status === "SUSPENDED") {
    return `<div class="small" style="margin-top:6px">${graceUntil || paidUntil}. ${reason || 'Функции заведения ограничены до продления.'}</div>`;
  }
  return `<div class="small" style="margin-top:6px">${paidUntil}</div>`;
}

function setupHint(v){
  const accessMode = getBillingAccessMode(v);
  const canSetup = isOwnerRole(v?.my_role) && accessMode === "FULL";
  if (!canSetup) return { hint: "", button: "", statusChip: "" };

  const status = getSetupStatus(v);
  const progress = getSetupProgress(v);
  const prepareDone = isSetupPrepareDone(v);
  const done = isSetupDone(v);
  if (done) {
    return {
      hint: `<div class="small" style="margin-top:6px">Настройка завершена. Заведение полностью готово к работе.</div>`,
      button: "",
      statusChip: '<span class="badge" style="margin-left:8px">setup ok</span>',
    };
  }
  const phase = prepareDone ? "extra" : "prepare";
  const resumeStep = getSetupResumeStep(v);
  const url = new URL(`/owner-setup.html`, location.origin);
  url.searchParams.set("venue_id", String(v.id));
  url.searchParams.set("phase", phase);
  if (resumeStep) url.searchParams.set("step", String(resumeStep));
  const label = getSetupActionLabel(v);
  const resolved = Number(progress.resolved || progress.done || 0) || 0;
  const total = Number(progress.total || 0) || 0;
  const hintText = prepareDone
    ? `Базовая настройка завершена. Можно добить дополнительный этап: расходы, поставщики и регулярные правила.`
    : (status === "NOT_STARTED"
      ? `Мастер ещё не запускался. Базовая настройка поможет быстро подготовить заведение к работе.`
      : `Настройка в процессе: ${resolved}/${total || 0}. Базовый запуск ещё не завершён.`);
  return {
    hint: `<div class="small" style="margin-top:6px">${esc(hintText)}</div>`,
    button: `<a class="btn inline" href="${url.pathname + url.search}" data-open-setup data-id="${v.id}">${esc(label)}</a>`,
    statusChip: prepareDone
      ? '<span class="badge" style="margin-left:8px">доп. настройка</span>'
      : '<span class="badge" style="margin-left:8px">setup</span>',
  };
}

function venueCard(v){
  const archived = !!v.is_archived;
  const chip = archived ? '<span class="badge" style="margin-left:8px">архив</span>' : '';
  const billing = billingChip(v);
  const setup = setupHint(v);
  const hint = archived
    ? '<div class="small" style="margin-top:6px">Заведение сейчас в архиве. Доступно только владельцу.</div>'
    : `${billingHint(v)}${setup.hint}`;
  const href = v.open_target || `/staff-shifts.html?venue_id=${encodeURIComponent(v.id)}`;
  const accessMode = getBillingAccessMode(v);
  const isReadonlyOwner = isOwnerRole(v?.my_role) && accessMode === "BILLING_READONLY";
  const buttonLabel = isReadonlyOwner ? 'Открыть оплату' : 'Открыть';
  return `
    <div class="itemcard">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div style="min-width:0;flex:1 1 280px;">
          <b>${esc(v.name)}${chip}${billing}${setup.statusChip}</b>
          <div class="small">${v.my_role ? esc(String(v.my_role).toUpperCase() === "OWNER" ? "Владелец" : "Персонал") : ""}</div>
          ${hint}
        </div>
        <div class="row gap-8" style="align-items:flex-start;flex-wrap:wrap;justify-content:flex-end">
          ${setup.button}
          <a class="btn subtle inline" href="${href}" data-open data-id="${v.id}">${buttonLabel}</a>
        </div>
      </div>
    </div>
  `;
}

function renderSections(data){
  const visible = (data || []).filter((v) => String(getBillingAccessMode(v)) !== "DENIED");
  const active = visible.filter((v) => !v.is_archived);
  const archived = visible.filter((v) => !!v.is_archived);
  if (!active.length && !archived.length) {
    list.innerHTML = `<div class="muted">Пока нет доступных заведений</div>`;
    return;
  }
  let html = '';
  if (active.length) {
    html += `
      <div class="section-head" style="margin-top:6px"><div class="section-title"><b>Активные заведения</b></div></div>
      <div class="list">${active.map(venueCard).join('')}</div>
    `;
  }
  if (archived.length) {
    html += `
      <div class="section-head" style="margin-top:14px"><div class="section-title"><b>Архив</b></div><div class="small">Архивные заведения доступны только владельцу.</div></div>
      <div class="list">${archived.map(venueCard).join('')}</div>
    `;
  }
  list.innerHTML = html;
  list.querySelectorAll('[data-open], [data-open-setup]').forEach((el) => {
    el.onclick = (e) => {
      e.preventDefault();
      const id = el.getAttribute('data-id');
      if (id) setActiveVenueId(id);
      location.href = el.getAttribute('href') || '/app-venues.html';
    };
  });
}

async function load(){
  list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
  try{
    const data = await api("/me/venues?include_archived=true");
    window.__lastJson = data;
    renderSections(Array.isArray(data) ? data : []);
  }catch(e){
    list.innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`;
    toast("Ошибка загрузки: " + e.message, "err");
  }
}

(async () => {
  const ok = await ensureLogin({ silent:true });
  if (!ok.ok) return;
  await load();
})();
</script>
</body>
</html>
