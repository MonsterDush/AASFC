<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260802-navbuttons1" />
  <link rel="stylesheet" href="/styles/pages/app-adjustments.css?v=20260726-polish9" />
  <script>
    (() => {
      try {
        const requested = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem("axelio.lang");
        const detected = String(requested || stored || navigator.languages?.[0] || navigator.language || "ru").toLowerCase();
        document.documentElement.lang = detected.startsWith("en") ? "en" : "ru";
      } catch {}
    })();
  </script>
  <script type="module" src="/i18n-bootstrap.js?v=20260820-i18n6"></script>
  <script src="/page-loader.js?v=20260823-navfix1"></script>
  <title>Axelio · Штрафы / Списания / Премии</title>
</head>
<body class="app-adjustments-page">
  <div class="container app-adjustments-shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Штрафы / Списания / Премии</b>
          <div class="muted" id="subtitle">управление</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <main class="app-adjustments-content">
    <section class="card app-adjustments-card">
      <div class="app-adjustments-toolbar">
        <div class="app-adjustments-month">
          <button class="btn" id="monthPrev" aria-label="Предыдущий месяц">◀</button>
          <b id="monthLabel">…</b>
          <button class="btn" id="monthNext" aria-label="Следующий месяц">▶</button>
        </div>
        <div class="app-adjustments-actions">
          <label class="app-adjustments-filter">
            <span class="muted small">Тип операции</span>
          <select id="typeSel">
            <option value="">Все</option>
            <option value="penalty">Штрафы</option>
            <option value="writeoff">Списания</option>
            <option value="bonus">Премии</option>
          </select>
          </label>
          <button class="btn primary" id="btnCreate">+ Добавить</button>
        </div>
      </div>

      <div id="list" class="app-adjustments-list">
        <div class="app-adjustments-loading">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </div>
      </div>
    </section>
    </main>

    <div class="nav">
      <div class="wrap"><div id="nav"></div></div>
    </div>

    <div class="toast" id="toast"><div class="toast__text"></div></div>

    <div class="modal" id="modal">
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <div class="modal__head">
          <div>
            <b class="modal__title">Создать</b>
            <div class="modal__subtitle" id="modalSubtitle"></div>
          </div>
          <button class="btn" data-close>Закрыть</button>
        </div>
        <div class="modal__body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/app-adjustments.js?v=20260726-navmore1"></script>
</body>
</html>
