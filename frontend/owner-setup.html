<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260802-navbuttons1" />
  <link rel="stylesheet" href="/styles/pages/owner-setup.css?v=20260725-polish3" />
  <script>
    (() => {
      try {
        const requested = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem("axelio.lang");
        const detected = String(requested || stored || navigator.languages?.[0] || navigator.language || "ru").toLowerCase();
        document.documentElement.lang = detected.startsWith("en") ? "en" : "ru";
      } catch {}
    })();
  </script>
  <script type="module" src="/i18n-bootstrap.js?v=20260820-i18n6"></script>
  <script src="/page-loader.js?v=20260820-i18n6"></script>
  <title>Axelio · Быстрая настройка</title>
</head>
<body class="owner-setup-page">
  <div class="container owner-setup-shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Быстрая настройка</b>
          <div class="muted">пошаговая подготовка заведения к работе</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="setup-page" id="root">
      <div class="itemcard section-card setup-loading" aria-label="Загрузка мастера настройки">
        <div class="skeleton skeleton--text"></div>
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--control"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Подтверждение</div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="nav">
    <div class="wrap"><div id="nav"></div></div>
  </div>

  <script type="module" src="/owner-setup.js?v=20260810-setup1"></script>
</body>
</html>
