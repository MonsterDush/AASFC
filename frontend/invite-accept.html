<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260802-navbuttons1" />
  <link rel="stylesheet" href="/styles/pages/invites.css?v=20260725-polish4" />
  <script>
    (() => {
      try {
        const requested = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem("axelio.lang");
        const detected = String(requested || stored || navigator.languages?.[0] || navigator.language || "ru").toLowerCase();
        document.documentElement.lang = detected.startsWith("en") ? "en" : "ru";
      } catch {}
    })();
  </script>
  <script type="module" src="/i18n-bootstrap.js?v=20260813-i18n5"></script>
  <script src="/page-loader.js?v=20260813-i18n5"></script>
  <title>Axelio · Принять приглашение</title>
</head>
<body class="invite-accept-page">
  <div class="container invite-accept-shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Принять приглашение</b>
          <div class="muted">по ссылке приглашения</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <main class="itemcard section-card invite-accept-card" id="card">
      <div id="state" class="invite-state invite-accept-state">Загрузка приглашения…</div>
    </main>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <script type="module">
    import { applyTelegramTheme, ensureLogin, api, toast, wa, redirectToAuth } from '/app.js?v=20260813-i18n1';
    function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    const params = new URLSearchParams(location.search);
    const token = (params.get('token') || '').trim();
    const state = document.getElementById('state');
    const card = document.getElementById('card');
    const currentNext = `${location.pathname || '/invite-accept.html'}${location.search || ''}${location.hash || ''}`;

    applyTelegramTheme();

    function channelLabel(channel) { return String(channel || '').toUpperCase() === 'PHONE' ? 'Телефон' : 'Telegram'; }
    function roleLabel(role) { return String(role || '').toUpperCase() === 'OWNER' ? 'Владелец' : 'Персонал'; }
    function inviteStatusLabel(status) {
      const s = String(status || '').toUpperCase();
      if (s === 'PENDING') return 'Ожидает подтверждения';
      if (s === 'ACCEPTED') return 'Принято';
      if (s === 'CANCELLED') return 'Отменено';
      if (s === 'EXPIRED') return 'Истекло';
      return status || '—';
    }
    function inviteStatusClass(status) {
      const s = String(status || '').toUpperCase();
      if (s === 'ACCEPTED') return 'invite-status invite-status--success';
      if (s === 'CANCELLED' || s === 'EXPIRED') return 'invite-status invite-status--error';
      return 'invite-status invite-status--pending';
    }

    function renderAcceptError(message) {
      card.innerHTML = `
        <div class="invite-state invite-state--error invite-accept-state">
          <b>Не удалось открыть приглашение</b>
          <span>${esc(message || 'Ссылка недействительна или больше не активна.')}</span>
          <button class="btn subtle inline" type="button" data-nav-button data-href="/index.html">На главную</button>
        </div>
      `;
    }

    function renderInvite(inv) {
      const contact = inv.invite_channel === 'PHONE' ? (inv.contact_label || inv.phone || '—') : ('@' + (inv.tg_username || '—'));
      const positionTitle = inv?.default_position?.title || inv?.position_title || '';
      const loginHint = inv.invite_channel === 'PHONE'
        ? 'Для этого приглашения нужно войти по тому же номеру телефона, на который оно отправлено.'
        : 'Для этого приглашения нужно войти под нужным Telegram-аккаунтом.';
      card.innerHTML = `
        <div class="invite-accept-head">
          <div>
            <div class="invite-accept-eyebrow">Вас приглашают в заведение</div>
            <b class="invite-accept-title">${esc(inv.venue_name || 'Приглашение')}</b>
          </div>
          <span class="${inviteStatusClass(inv.status)}">${esc(inviteStatusLabel(inv.status))}</span>
        </div>
        <div class="invite-meta">
          <div class="invite-meta-item"><span>Канал</span><b>${esc(channelLabel(inv.invite_channel))}</b></div>
          <div class="invite-meta-item"><span>Роль</span><b>${esc(roleLabel(inv.venue_role))}</b></div>
          <div class="invite-meta-item"><span>Получатель</span><b>${esc(contact)}</b></div>
          ${positionTitle ? `<div class="invite-meta-item"><span>Должность</span><b>${esc(positionTitle)}</b></div>` : ''}
        </div>
        <div class="invite-login-note">${esc(loginHint)}</div>
        <div class="invite-accept-actions" id="actionsRow"></div>
      `;
      const actions = document.getElementById('actionsRow');
      const btnAccept = document.createElement('button');
      btnAccept.className = 'btn primary';
      btnAccept.textContent = 'Принять приглашение';
      btnAccept.onclick = acceptInvite;
      actions.appendChild(btnAccept);

      const btnAuth = document.createElement('button');
      btnAuth.className = 'btn';
      btnAuth.textContent = inv.invite_channel === 'PHONE' ? 'Войти по номеру' : 'Войти';
      btnAuth.onclick = () => redirectToAuth(currentNext);
      actions.appendChild(btnAuth);

      const home = document.createElement('a');
      home.className = 'btn';
      home.href = '/index.html';
      home.textContent = 'На главную';
      actions.appendChild(home);
    }

    async function acceptInvite() {
      const login = await ensureLogin({ silent:true, redirectOnFail: false });
      if (!login.ok) {
        redirectToAuth(currentNext);
        return;
      }
      try {
        const out = await api(`/public/invites/${encodeURIComponent(token)}/accept`, { method:'POST' });
        toast('Приглашение принято', 'ok');
        const vid = out?.venue_id;
        if (vid) {
          location.replace(`/app-venue.html?venue_id=${encodeURIComponent(vid)}`);
          return;
        }
        location.replace('/index.html');
      } catch (e) {
        toast(e?.data?.detail || e.message || 'Не удалось принять приглашение', 'err');
      }
    }

    if (!token) {
      renderAcceptError('Ссылка приглашения недействительна');
    } else {
      try {
        const inv = await api(`/public/invites/${encodeURIComponent(token)}`);
        renderInvite(inv);
      } catch (e) {
        const detail = e?.data?.detail || e.message || '';
        renderAcceptError(detail === 'Invite not found'
          ? 'Приглашение не найдено, отменено или ссылка больше не активна.'
          : (detail || 'Не удалось открыть приглашение'));
      }
    }
  </script>
</body>
</html>
