<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Начисления</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Начисления</b>
          <div class="muted" id="subtitle">расчёт зарплат за месяц</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card finance-toolbar">
      <div class="row" style="justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <div>
          <b>Начисления за месяц</b>
          <div class="muted mt-6">MVP расчёт по профилям зарплаты и сменам</div>
        </div>
        <div class="row" style="gap:8px; flex-wrap:wrap; align-items:center;">
          <input id="payrollMonthPick" type="month" style="width:auto; min-width:160px;" />
          <button class="btn" id="openProfilesBtn">Профили</button>
          <button class="btn" id="refreshPayrollBtn">Обновить</button>
          <button class="btn" id="calculatePayrollBtn">Рассчитать</button>
        </div>
      </div>

      <div class="finance-stats mt-12">
        <div class="itemcard finance-stat">
          <div class="finance-stat__label">Сумма</div>
          <div class="finance-stat__value" id="payrollTotal">—</div>
        </div>
        <div class="itemcard finance-stat">
          <div class="finance-stat__label">Сотрудников</div>
          <div class="finance-stat__value" id="payrollLinesCount">—</div>
        </div>
        <div class="itemcard finance-stat">
          <div class="finance-stat__label">Рассчитано</div>
          <div class="finance-stat__value" id="payrollCalculatedAt">—</div>
        </div>
        <div class="itemcard finance-stat">
          <div class="finance-stat__label">Статус</div>
          <div class="finance-stat__value" id="payrollState">—</div>
        </div>
      </div>
    </div>

    <div class="card mt-12">
      <div class="row" style="justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
        <b>Строки начислений</b>
        <div class="muted" id="payrollHint">—</div>
      </div>
      <div id="payrollLines" class="entity-list mt-12"></div>
    </div>

    <div class="nav">
      <div class="wrap">
        <div id="nav"></div>
      </div>
    </div>

    <div class="toast" id="toast"><div class="toast__text"></div></div>
    <div class="modal" id="modal">
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <div class="modal__head">
          <b class="modal__title">JSON</b>
          <button class="btn" data-close>Close</button>
        </div>
        <div class="modal__body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/owner-payroll.js"></script>
</body>
</html>
