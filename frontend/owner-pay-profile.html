<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Профиль зарплаты</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Профиль зарплаты</b>
          <div class="muted" id="subtitle">детали профиля</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card finance-toolbar">
      <div class="row" style="justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <div>
          <b id="profileHeadline">—</b>
          <div class="muted mt-6" id="profileMeta">—</div>
        </div>
        <div class="row" style="gap:8px; flex-wrap:wrap; align-items:center;">
          <a class="btn" id="backToProfilesBtn" href="#">К списку профилей</a>
          <button class="btn" id="openPayrollPageBtn">Начисления</button>
          <button class="btn" id="editProfileBtn">Изменить профиль</button>
          <button class="btn" id="addComponentBtn">Добавить компонент</button>
          <button class="btn" id="addAssignmentBtn">Назначить сотруднику</button>
        </div>
      </div>
    </div>

    <div class="card mt-12">
      <div class="row" style="justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
        <b>Компоненты</b>
        <div class="muted" id="componentsHint">—</div>
      </div>
      <div id="componentsList" class="entity-list mt-12"></div>
    </div>

    <div class="card mt-12">
      <div class="row" style="justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
        <b>Назначения</b>
        <div class="muted" id="assignmentsHint">—</div>
      </div>
      <div id="assignmentsList" class="entity-list mt-12"></div>
    </div>

    <div class="nav">
      <div class="wrap">
        <div id="nav"></div>
      </div>
    </div>

    <div class="toast" id="toast"><div class="toast__text"></div></div>
    <div class="modal" id="modal">
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <div class="modal__head">
          <b class="modal__title">JSON</b>
          <button class="btn" data-close>Close</button>
        </div>
        <div class="modal__body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/owner-pay-profile.js"></script>
</body>
</html>
