<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260720-unified11" />
  <script src="/page-loader.js?v=20260720-loader1"></script>
  <title>Axelio · Загрузка</title>
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash__logo"></div>
    <b>Axelio</b>
    <div class="muted" style="margin-top:4px">Загружаю…</div>
    <div class="spinner"></div>
  </div>
  <div class="container" id="fallback">
    <div class="card">
      <b>Не удалось загрузить приложение</b>
      <div class="muted mt-8">
        Нужна авторизация. Если ты не в Telegram, войди по номеру телефона.
      </div>
      <div class="mt-12">
        <a class="btn primary" href="/auth.html">Открыть авторизацию</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <script>
    window.__axelioIndexWatchdog = setTimeout(() => {
      const splash = document.getElementById("splash");
      const fallback = document.getElementById("fallback");
      if (splash) splash.style.display = "none";
      if (fallback) fallback.style.display = "block";
    }, 8000);
  </script>
 <script type="module">
  import { applyTelegramTheme, ensureLogin, getMe, getMyVenues, getMyVenuePermissions, toast, setActiveVenueId, buildAuthUrl } from "/app.js?v=20260719-split1";

  const splash = document.getElementById("splash");
  const fallback = document.getElementById("fallback");
  const hideSplash = () => splash && (splash.style.display = "none");

  applyTelegramTheme();

  (async () => {
    try {
      const login = await ensureLogin({ silent: true, redirectOnFail: false, timeoutMs: 5000, telegramWaitMs: 5000 });

      if (!login.ok && login.reason === "NO_INITDATA") {
        location.replace(buildAuthUrl(`${location.pathname}${location.search}${location.hash}`));
        return;
      }

      if (!login.ok) {
        hideSplash();
        fallback.style.display = "block";
        // Покажем понятную причину (если есть)
        const msg =
          login.code === "TIMEOUT"
            ? "Не удалось связаться с API. Проверь сервер и CORS."
            : login.reason === "NO_INITDATA"
              ? "Откройте приложение через Telegram."
              : (login.data?.detail || login.message || "Ошибка авторизации");
        toast(msg, "err");
        return;
      }

      const me = await getMe({ timeoutMs: 8000 });
      if (me?.system_role === "SUPER_ADMIN") {
        location.replace("/admin-venues.html");
        return;
      }

      // Role-based landing:
// - SUPER_ADMIN -> admin
// - If there is an "active venue" selected: land based on role in that venue
// - Otherwise: if exactly 1 venue -> land based on role
// - Otherwise -> venues picker
let venues = [];
try { venues = await getMyVenues({ timeoutMs: 8000 }); } catch (e) {
  hideSplash();
  fallback.style.display = "block";
  toast(e?.code === "TIMEOUT" || /TIMEOUT/i.test(String(e?.message || "")) ? "Не удалось получить список заведений. Похоже, завис запрос /me/venues в Telegram WebView." : "Не удалось получить список заведений", "err");
  return;
}

if (!Array.isArray(venues) || venues.length === 0) {
  location.replace("/app-venues.html");
  return;
}

const activeId = (localStorage.getItem("axelio.activeVenueId") || "").trim();
let v = null;
if (activeId) {
  v = venues.find(x => String(x?.id) === String(activeId)) || null;
}
if (!v && venues.length === 1) v = venues[0];

if (!v) {
  // No active venue and multiple venues -> let user pick
  location.replace("/app-venues.html");
  return;
}

const vid = v?.id;
if (vid) setActiveVenueId(vid);

// determine role in active venue
const role = String(v?.my_role || "").toUpperCase();
if (role) {
  location.replace(role === "STAFF"
    ? `/staff-shifts.html?venue_id=${encodeURIComponent(vid)}`
    : `/owner-summary.html?venue_id=${encodeURIComponent(vid)}`
  );
  return;
}

// Fallback: ask permissions endpoint if my_role отсутствует
try {
  const perms = await getMyVenuePermissions(vid, { timeoutMs: 8000 });
  const r = String(perms?.role || "").toUpperCase();
  location.replace(r === "STAFF"
    ? `/staff-shifts.html?venue_id=${encodeURIComponent(vid)}`
    : `/owner-summary.html?venue_id=${encodeURIComponent(vid)}`
  );
  return;
} catch {
  location.replace("/app-venues.html");
  return;
}
} catch (e) {
      hideSplash();
      fallback.style.display = "block";
      toast("Ошибка загрузки: " + (e?.data?.detail || e?.message || e), "err");
    }
  })();
</script>

</body>
</html>
