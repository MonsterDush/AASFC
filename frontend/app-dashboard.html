<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260722-split1" />
  <script src="/page-loader.js?v=20260720-loader1"></script>
  <title>Axelio · Обзор</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Обзор разделов</b>
          <div class="muted" id="subtitle">быстрые переходы по вашим правам</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card finance-toolbar">
      <div class="screen-hero">
        <div class="screen-hero__head">
          <div>
            <b>Доступные разделы</b>
            <div class="page-caption mt-6" id="overviewHint">Здесь собраны разделы, которые доступны вам по правам в этом заведении.</div>
          </div>
        </div>
      </div>

      <div class="action-grid action-grid--adaptive action-grid--mobile-2 mt-12" id="sectionsGrid">
        <div class="itemcard section-card"><div class="muted">Загрузка разделов…</div></div>
      </div>
    </div>

    <div class="nav">
      <div class="wrap">
        <div id="nav"></div>
      </div>
    </div>

    <div class="toast" id="toast"><div class="toast__text"></div></div>
    <div class="modal" id="modal">
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <div class="modal__head">
          <b class="modal__title">Детали</b>
          <button class="btn" data-close>Закрыть</button>
        </div>
        <div class="modal__body"></div>
      </div>
    </div>
  </div>

  <script type="module">
import {
  applyTelegramTheme,
  mountCommonUI,
  ensureLogin,
  mountNav,
  getActiveVenueId,
  setActiveVenueId,
  getMyVenues,
  getMyVenuePermissions,
  getMe,
} from "/app.js?v=20260722-dynamic1";
import {
  permSetFromResponse,
  roleUpper,
  buildStaffDashboardItems,
} from "/permissions.js";

applyTelegramTheme();
mountCommonUI("overview");
await ensureLogin({ silent: true });

const params = new URLSearchParams(location.search);
const urlVenueId = params.get("venue_id");
if (urlVenueId) setActiveVenueId(urlVenueId);

await mountNav({ activeTab: "overview" });

const activeId = getActiveVenueId();
const grid = document.getElementById("sectionsGrid");
const subtitle = document.getElementById("subtitle");
const overviewHint = document.getElementById("overviewHint");

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderItems(items = []) {
  if (!grid) return;
  if (!items.length) {
    grid.innerHTML = `<div class="itemcard section-card"><b>Нет доступных разделов</b><div class="muted mt-6">Для этого заведения вам пока не выданы права на отдельные экраны.</div></div>`;
    return;
  }

  grid.innerHTML = items.map((item) => `
    <div class="itemcard section-card">
      <div class="section-card__title">
        <b>${esc(item.title || "Раздел")}</b>
        <div class="muted">${esc(item.hint || "")}</div>
      </div>
      <div class="btn-row mt-12">
        <a class="btn primary" href="${esc(item.href || '#')}">Открыть</a>
      </div>
    </div>
  `).join("");
}

try {
  const venues = await getMyVenues().catch(() => []);
  const v = Array.isArray(venues)
    ? venues.find((x) => String(x.id) === String(activeId))
    : null;
  if (v) {
    document.getElementById("title").textContent = v.name || "Обзор разделов";
    if (subtitle) subtitle.textContent = "разделы по вашим правам";
  }
} catch {}

if (!activeId) {
  renderItems([]);
  if (overviewHint) overviewHint.textContent = "Сначала выберите заведение.";
} else {
  try {
    const [me, perms] = await Promise.all([
      getMe().catch(() => null),
      getMyVenuePermissions(activeId),
    ]);
    perms.system_role = perms?.system_role || me?.system_role || "";
    const pset = permSetFromResponse(perms);
    const role = roleUpper(perms);
    const items = buildStaffDashboardItems(pset, role, String(perms?.system_role || ""), activeId);
    renderItems(items);
    if (overviewHint) {
      const extraCount = items.filter((item) => item.isExtra).length;
      overviewHint.textContent = extraCount
        ? `Здесь собраны все разделы, которые доступны вам в этом заведении. Дополнительных экранов: ${extraCount}.`
        : "Здесь собраны ваши основные рабочие разделы для этого заведения.";
    }
  } catch (e) {
    renderItems([]);
    if (overviewHint) overviewHint.textContent = e?.message || "Не удалось загрузить доступные разделы.";
  }
}
  </script>
</body>
</html>
