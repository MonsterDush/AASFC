<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260802-navbuttons1" />
  <link rel="stylesheet" href="/styles/pages/app-dashboard.css?v=20260723-polish2" />
  <script>
    (() => {
      try {
        const requested = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem("axelio.lang");
        const detected = String(requested || stored || navigator.languages?.[0] || navigator.language || "ru").toLowerCase();
        document.documentElement.lang = detected.startsWith("en") ? "en" : "ru";
      } catch {}
    })();
  </script>
  <script type="module" src="/i18n-bootstrap.js?v=20260820-i18n6"></script>
  <script src="/page-loader.js?v=20260820-assurance1"></script>
  <title>Axelio · Обзор</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Обзор разделов</b>
          <div class="muted" id="subtitle">быстрые переходы по вашим правам</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card finance-toolbar dashboard-shell">
      <div class="screen-hero">
        <div class="screen-hero__head">
          <div>
            <b>Доступные разделы</b>
            <div class="page-caption mt-6" id="overviewHint">Здесь собраны разделы, которые доступны вам по правам в этом заведении.</div>
          </div>
        </div>
      </div>

      <div class="dashboard-sections-grid mt-12" id="sectionsGrid" aria-live="polite">
        <div class="dashboard-card-grid" aria-hidden="true">
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </div>
    </div>

    <div class="nav">
      <div class="wrap">
        <div id="nav"></div>
      </div>
    </div>

    <div class="toast" id="toast"><div class="toast__text"></div></div>
    <div class="modal" id="modal">
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <div class="modal__head">
          <b class="modal__title">Детали</b>
          <button class="btn" data-close>Закрыть</button>
        </div>
        <div class="modal__body"></div>
      </div>
    </div>
  </div>

  <script type="module">
import {
  applyTelegramTheme,
  mountCommonUI,
  ensureLogin,
  mountNav,
  getActiveVenueId,
  setActiveVenueId,
  getMyVenues,
  getMyVenuePermissions,
  getMe,
} from "/app.js?v=20260820-i18nmetrika1";
import {
  permSetFromResponse,
  roleUpper,
  buildStaffDashboardItems,
} from "/permissions.js";

applyTelegramTheme();
mountCommonUI("overview");
await ensureLogin({ silent: true });

const params = new URLSearchParams(location.search);
const urlVenueId = params.get("venue_id");
if (urlVenueId) setActiveVenueId(urlVenueId);

await mountNav({ activeTab: "overview" });

const activeId = getActiveVenueId();
const grid = document.getElementById("sectionsGrid");
const subtitle = document.getElementById("subtitle");
const overviewHint = document.getElementById("overviewHint");

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderItems(items = []) {
  if (!grid) return;
  if (!items.length) {
    renderState({
      title: "Нет доступных разделов",
      text: "Для этого заведения вам пока не выданы права на отдельные экраны.",
    });
    return;
  }

  const renderCard = (item) => `
    <article class="itemcard section-card dashboard-section-card${item.isExtra ? " dashboard-section-card--extra" : ""}">
      <div class="section-card__title">
        <b class="dashboard-section-card__title">${esc(item.title || "Раздел")}</b>
        <div class="muted">${esc(item.hint || "")}</div>
      </div>
      <div class="dashboard-section-card__actions">
        <a class="btn primary" href="${esc(item.href || '#')}">Открыть</a>
      </div>
    </article>
  `;
  const primaryItems = items.filter((item) => !item.isExtra);
  const extraItems = items.filter((item) => item.isExtra);
  const groups = [
    { title: "Основные разделы", items: primaryItems },
    { title: "Дополнительные разделы", items: extraItems, extra: true },
  ].filter((group) => group.items.length);

  grid.classList.remove("dashboard-sections-grid--state");
  grid.innerHTML = groups.map((group) => `
    <section class="dashboard-section-group${group.extra ? " dashboard-section-group--extra" : ""}">
      <div class="section-head dashboard-section-group__head">
        <div class="section-title"><b>${group.title}</b><span class="badge">${group.items.length}</span></div>
      </div>
      <div class="dashboard-card-grid">${group.items.map(renderCard).join("")}</div>
    </section>
  `).join("");
}

function renderState({ title, text, actionHref = "", actionLabel = "", retry = false } = {}) {
  if (!grid) return;
  grid.classList.add("dashboard-sections-grid--state");
  const action = actionHref && actionLabel
    ? `<a class="btn primary" href="${esc(actionHref)}">${esc(actionLabel)}</a>`
    : (retry ? '<button class="btn" id="retryDashboardBtn" type="button">Повторить</button>' : "");
  grid.innerHTML = `
    <div class="state dashboard-state">
      <div class="state__title">${esc(title || "Разделы недоступны")}</div>
      <div class="state__text">${esc(text || "Попробуйте обновить страницу позже.")}</div>
      ${action ? `<div class="state__actions">${action}</div>` : ""}
    </div>
  `;
  if (retry) document.getElementById("retryDashboardBtn")?.addEventListener("click", () => location.reload());
}

try {
  const venues = await getMyVenues().catch(() => []);
  const v = Array.isArray(venues)
    ? venues.find((x) => String(x.id) === String(activeId))
    : null;
  if (v) {
    document.getElementById("title").textContent = v.name || "Обзор разделов";
    if (subtitle) subtitle.textContent = "разделы по вашим правам";
  }
} catch {}

if (!activeId) {
  renderState({
    title: "Заведение не выбрано",
    text: "Выберите заведение, чтобы увидеть доступные рабочие разделы.",
    actionHref: "/app-venues.html",
    actionLabel: "Выбрать заведение",
  });
  if (overviewHint) overviewHint.textContent = "Сначала выберите заведение.";
} else {
  try {
    const [me, perms] = await Promise.all([
      getMe().catch(() => null),
      getMyVenuePermissions(activeId),
    ]);
    perms.system_role = perms?.system_role || me?.system_role || "";
    const pset = permSetFromResponse(perms);
    const role = roleUpper(perms);
    const items = buildStaffDashboardItems(pset, role, String(perms?.system_role || ""), activeId);
    renderItems(items);
    if (overviewHint) {
      const extraCount = items.filter((item) => item.isExtra).length;
      overviewHint.textContent = extraCount
        ? `Здесь собраны все разделы, которые доступны вам в этом заведении. Дополнительных экранов: ${extraCount}.`
        : "Здесь собраны ваши основные рабочие разделы для этого заведения.";
    }
  } catch (e) {
    const errorText = e?.message || "Не удалось загрузить доступные разделы.";
    renderState({ title: "Не удалось загрузить разделы", text: errorText, retry: true });
    if (overviewHint) overviewHint.textContent = errorText;
  }
}
  </script>
</body>
</html>
