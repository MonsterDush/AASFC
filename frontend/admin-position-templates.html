<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260802-navbuttons1" />
  <link rel="stylesheet" href="/styles/pages/admin-position-templates.css?v=20260726-polish7" />
  <script>
    (() => {
      try {
        const requested = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem("axelio.lang");
        const detected = String(requested || stored || navigator.languages?.[0] || navigator.language || "ru").toLowerCase();
        document.documentElement.lang = detected.startsWith("en") ? "en" : "ru";
      } catch {}
    })();
  </script>
  <script type="module" src="/i18n-bootstrap.js?v=20260820-i18n6"></script>
  <script src="/page-loader.js?v=20260823-navfix1"></script>
  <title>Axelio · Админ · Шаблоны прав</title>
</head>
<body class="admin-position-templates-page">
  <div class="container tpl-shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Админ · Шаблоны прав должностей</b>
          <div class="muted">Глобальные пресеты для мастера настройки и страницы должностей</div>
        </div>
      </div>
      <div class="userpill" data-userpill>—</div>
    </div>

    <main class="tpl-content">
      <section class="card tpl-toolbar-card">
        <div class="tpl-toolbar">
          <button id="btnSeedDefaults" class="btn">Добавить базовые шаблоны</button>
          <button id="btnNew" class="btn primary">Новый шаблон</button>
          <button id="btnShowInactive" class="btn subtle">Скрыть архив</button>
          <span id="status" class="muted tpl-status" aria-live="polite"></span>
        </div>
      </section>

      <div id="root" class="tpl-grid">
        <div class="tpl-state tpl-state--loading">Загрузка шаблонов…</div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Подтверждение</div>
        <button class="btn" type="button" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="nav"><div class="wrap"><div id="nav"></div></div></div>
  <script type="module" src="/admin-position-templates.js?v=20260726-navmore1"></script>
</body>
</html>
