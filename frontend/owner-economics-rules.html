<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Нормативы и алерты</title>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Нормативы и алерты</b>
          <div class="muted">владелец сам выбирает, какие правила учитывать в предупреждениях</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <div class="card finance-toolbar">
      <div class="row" style="justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <div>
          <b>Правила заведения</b>
          <div class="muted mt-6">Пустое или выключенное правило не участвует в алертах экономики дня.</div>
        </div>
        <div class="row" style="gap:8px; flex-wrap:wrap; align-items:center;">
          <button class="btn ghost" id="openPlansBtn">Планы</button>
          <button class="btn" id="openDayEconomicsFromRulesBtn">Экономика дня</button>
        </div>
      </div>

      <div class="itemcard mt-12">
        <div class="row" style="justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
          <div>
            <b>Активные правила</b>
            <div class="muted mt-6" id="rulesSummaryHint">—</div>
          </div>
        </div>
      </div>

      <div class="itemcard mt-12" id="rulesManageCard">
        <div class="row" style="justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap;">
          <div>
            <b>Редактировать нормативы</b>
            <div class="muted mt-6">Можно включать и выключать каждое правило отдельно.</div>
          </div>
          <div class="row" style="gap:8px; align-items:center; flex-wrap:wrap;">
            <span class="badge">Owner-only</span>
            <button class="btn ghost" id="enableAllRulesBtn" type="button">Включить всё</button>
            <button class="btn ghost" id="disableAllRulesBtn" type="button">Выключить всё</button>
            <button class="btn ghost" id="applyBaseRulesBtn" type="button">Базовый набор</button>
          </div>
        </div>
        <form id="economicsRulesFormPage" class="finance-form mt-12"></form>
      </div>
    </div>
  </div>

  <div class="nav"><div class="wrap"><div id="nav"></div></div></div>
  <div class="toast" id="toast"><div class="toast__text"></div></div>
  <script type="module" src="/owner-economics-rules.js"></script>
</body>
</html>
