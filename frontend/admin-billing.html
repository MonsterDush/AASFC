<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Админ · Биллинг</title>
  <style>
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    .summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    @media (min-width: 900px) { .summary-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    .summary-card { border:1px solid rgba(0,0,0,.12); border-radius:14px; padding:12px; }
    .summary-card b { display:block; font-size:20px; margin-top:6px; }
    .billing-table-row { border:1px solid rgba(0,0,0,.12); border-radius:14px; padding:12px; margin-top:10px; }
    .status-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid rgba(0,0,0,.14); font-size:12px; }
    .issue-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid rgba(0,0,0,.14); font-size:12px; }
    .issue-chip.critical { font-weight:700; }
    .issue-chip.warning { font-weight:600; }
    .section-title { margin:0 0 8px; }
    input[type="search"], select { min-width: 180px; }
    .split-grid { display:grid; grid-template-columns:1fr; gap:16px; }
    @media (min-width: 980px) { .split-grid { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Админ · Биллинг</b>
          <div class="muted">статусы, операции, возвраты и сверка</div>
        </div>
      </div>
      <div class="userpill" data-userpill>—</div>
    </div>

    <div class="card">
      <div class="summary-grid" id="summaryGrid"></div>
    </div>

    <div class="card">
      <div class="section-title"><b>Состояние биллинга</b></div>
      <div id="healthBlock" class="muted">Загрузка…</div>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="statusFilter">
          <option value="">Все статусы</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="GRACE">GRACE</option>
          <option value="SUSPENDED">SUSPENDED</option>
        </select>
        <select id="txTypeFilter">
          <option value="">Все типы операций</option>
          <option value="PAYMENT">PAYMENT</option>
          <option value="EXTEND">EXTEND</option>
          <option value="SET_PAID_UNTIL">SET_PAID_UNTIL</option>
          <option value="REFUND">REFUND</option>
        </select>
        <input id="search" type="search" placeholder="Поиск по заведению / invoice / комментарию" />
        <label class="row gap-8"><input id="dueSoon" type="checkbox" /> <span>Скоро заканчивается</span></label>
        <label class="row gap-8"><input id="overdue" type="checkbox" /> <span>Просроченные</span></label>
        <select id="sortBy">
          <option value="paid_until_asc">Сначала истекающие</option>
          <option value="paid_until_desc">Сначала дальние</option>
          <option value="last_payment_desc">Свежие оплаты</option>
          <option value="name_asc">По названию А-Я</option>
          <option value="name_desc">По названию Я-А</option>
        </select>
        <button class="btn" id="refreshBtn">Обновить</button>
      </div>
      <div class="muted" id="count">0</div>
      <div id="list"></div>
      <div class="row gap-8" style="margin-top:12px;justify-content:flex-end">
        <button class="btn subtle" id="prevPageBtn">← Назад</button>
        <span class="muted" id="pageInfo">1</span>
        <button class="btn subtle" id="nextPageBtn">Вперёд →</button>
      </div>
    </div>

    <div class="split-grid">
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
          <div>
            <div class="section-title"><b>Операции</b></div>
            <div class="muted">Единый реестр billing-операций.</div>
          </div>
          <div class="row gap-8">
            <button class="btn subtle" id="exportOpsBtn">Экспорт XLSX</button>
          </div>
        </div>
        <div id="operationsBlock" class="muted">Загрузка…</div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
          <div>
            <div class="section-title"><b>Проблемы и сверка</b></div>
            <div class="muted">Критичные и предупреждающие billing-кейсы.</div>
          </div>
          <div class="row gap-8">
            <select id="issueStatusFilter">
              <option value="OPEN">Открытые</option>
              <option value="RESOLVED">Решённые</option>
              <option value="IGNORED">Игнорируемые</option>
              <option value="ALL">Все</option>
            </select>
            <button class="btn subtle" id="exportReconBtn">Экспорт XLSX</button>
          </div>
        </div>
        <div id="reconciliationBlock" class="muted">Загрузка…</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Детали</div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div id="refundModal" class="modal">
    <div class="modal__backdrop" data-refund-close></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Возврат</div>
        <button class="btn" type="button" data-refund-close>Закрыть</button>
      </div>
      <div class="modal__body">
        <div class="small" id="refundVenueLabel">—</div>
        <label style="display:block;margin-top:12px">
          <div class="small mb-6">Сумма возврата, ₽</div>
          <input id="refundAmountInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="2990" style="width:100%" />
        </label>
        <label style="display:block;margin-top:12px">
          <div class="small mb-6">Причина</div>
          <textarea id="refundCommentInput" rows="4" placeholder="Причина возврата" style="width:100%"></textarea>
        </label>
        <div class="row gap-8" style="justify-content:flex-end;margin-top:14px">
          <button class="btn subtle" type="button" data-refund-close>Отмена</button>
          <button class="btn primary" type="button" id="refundSubmitBtn">Отправить возврат</button>
        </div>
      </div>
    </div>
  </div>

  <div class="nav"><div class="wrap"><div id="nav"></div></div></div>

<script type="module">
  import { applyTelegramTheme, mountCommonUI, ensureLogin, api, toast, mountNav, openModal } from "/app.js";

  applyTelegramTheme();
  mountCommonUI("admin-billing");
  await mountNav({ activeTab: "admin-billing" });

  function esc(s){ return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;"); }
  function formatDate(value){ if (!value) return "—"; const d = new Date(value); return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleDateString("ru-RU"); }
  function formatDateTime(value){ if (!value) return "—"; const d = new Date(value); return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString("ru-RU"); }
  function formatMinor(value){ return `${(Number(value || 0) / 100).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: 0 })} ₽`; }
  function txSourceLabel(value){ const v = String(value || '').toUpperCase(); if (v === 'MANUAL_ADMIN') return 'Ручное действие'; if (v === 'ROBOKASSA') return 'Robokassa'; return v || '—'; }
  function txTypeLabel(value){ const v = String(value || '').toUpperCase(); return ({ PAYMENT:'Оплата', EXTEND:'Продление', SET_PAID_UNTIL:'Установка paid until', REFUND:'Возврат' }[v]) || v || '—'; }
  function txStatusLabel(value){ const v = String(value || '').toUpperCase(); return ({ SUCCEEDED:'Успешно', PENDING:'Ожидает', FAILED:'Ошибка', CANCELED:'Отменено' }[v]) || v || '—'; }
  function issueChip(severity){ const s = String(severity || 'info').toLowerCase(); return `<span class="issue-chip ${s}">${esc(s)}</span>`; }
  function issueStatusLabel(value){ const v = String(value || '').toUpperCase(); return ({ OPEN:'Открыта', RESOLVED:'Решена', IGNORED:'Игнорируется' }[v]) || v || '—'; }
  function statusChip(status){ const s = String(status || '').toUpperCase(); const cls = s === 'ACTIVE' ? 'active' : (s === 'GRACE' ? 'grace' : 'suspended'); return `<span class="status-chip ${cls}">${esc(s || '—')}</span>`; }

  const summaryGrid = document.getElementById('summaryGrid');
  const healthBlock = document.getElementById('healthBlock');
  const listEl = document.getElementById('list');
  const operationsBlock = document.getElementById('operationsBlock');
  const reconciliationBlock = document.getElementById('reconciliationBlock');
  const statusFilter = document.getElementById('statusFilter');
  const txTypeFilter = document.getElementById('txTypeFilter');
  const searchEl = document.getElementById('search');
  const dueSoonEl = document.getElementById('dueSoon');
  const overdueEl = document.getElementById('overdue');
  const refreshBtn = document.getElementById('refreshBtn');
  const sortByEl = document.getElementById('sortBy');
  const prevPageBtn = document.getElementById('prevPageBtn');
  const nextPageBtn = document.getElementById('nextPageBtn');
  const pageInfoEl = document.getElementById('pageInfo');
  const countEl = document.getElementById('count');
  const exportOpsBtn = document.getElementById('exportOpsBtn');
  const exportReconBtn = document.getElementById('exportReconBtn');
  const issueStatusFilter = document.getElementById('issueStatusFilter');
  const refundModalEl = document.getElementById('refundModal');
  const refundVenueLabelEl = document.getElementById('refundVenueLabel');
  const refundAmountInputEl = document.getElementById('refundAmountInput');
  const refundCommentInputEl = document.getElementById('refundCommentInput');
  const refundSubmitBtn = document.getElementById('refundSubmitBtn');

  let currentPage = 1;
  let hasNextPage = false;
  let refundVenueId = null;
  let refundVenueName = '';

  function buildCommonQuery(){
    const qp = new URLSearchParams();
    if (searchEl.value.trim()) qp.set('q', searchEl.value.trim());
    return qp;
  }

  function renderSummary(data){
    const t = data?.totals || {};
    summaryGrid.innerHTML = `
      <div class="summary-card"><div class="muted">Активные</div><b>${Number(t.active || 0)}</b><div class="small">MRR: ${formatMinor(t.mrr_minor || 0)}</div></div>
      <div class="summary-card"><div class="muted">Grace</div><b>${Number(t.grace || 0)}</b><div class="small">Скоро закончится: ${Number(t.due_soon || 0)}</div></div>
      <div class="summary-card"><div class="muted">Suspended</div><b>${Number(t.suspended || 0)}</b><div class="small">Просрочено: ${Number(t.overdue || 0)}</div></div>
      <div class="summary-card"><div class="muted">Поступления / возвраты</div><b>${formatMinor(t.receipts_current_month_minor || 0)}</b><div class="small">Возвраты: ${formatMinor(t.refunds_current_month_minor || 0)}</div></div>
    `;
  }

  function renderHealth(data){
    const sev = data?.severity || {};
    const top = Array.isArray(data?.top_issue_codes) ? data.top_issue_codes : [];
    healthBlock.innerHTML = `
      <div class="row" style="gap:12px;flex-wrap:wrap">
        <div class="summary-card"><div class="muted">Critical</div><b>${Number(sev.critical || 0)}</b></div>
        <div class="summary-card"><div class="muted">Warning</div><b>${Number(sev.warning || 0)}</b></div>
        <div class="summary-card"><div class="muted">Info</div><b>${Number(sev.info || 0)}</b></div>
        <div class="summary-card"><div class="muted">Failed 24h</div><b>${Number(data?.failed_checkout_24h || 0)}</b></div>
      </div>
      <div class="muted mt-12">Топ кодов: ${top.length ? top.map((item) => `${esc(item.code)} (${Number(item.count || 0)})`).join(' · ') : 'нет'}</div>
    `;
  }

  function renderVenues(items, meta){
    const rows = Array.isArray(items) ? items : [];
    countEl.textContent = `${rows.length} / ${Number(meta?.total || rows.length || 0)}`;
    currentPage = Number(meta?.page || 1);
    hasNextPage = Boolean(meta?.has_next);
    pageInfoEl.textContent = `Стр. ${currentPage}`;
    prevPageBtn.disabled = currentPage <= 1;
    nextPageBtn.disabled = !hasNextPage;
    if (!rows.length) {
      listEl.innerHTML = `<div class="muted">Ничего не найдено</div>`;
      return;
    }
    listEl.innerHTML = rows.map((item) => `
      <div class="billing-table-row">
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
          <div style="min-width:0;flex:1 1 auto;">
            <div class="row gap-8" style="flex-wrap:wrap"><a class="btn subtle inline" href="/app-venue.html?venue_id=${item.venue_id}"><b>${esc(item.venue_name)}</b></a>${statusChip(item.status)}</div>
            <div class="small mt-6">Владелец: ${esc(item?.owner?.label || '—')}</div>
            <div class="small mt-6">Оплачено до: ${esc(formatDate(item.paid_until))}</div>
            <div class="small mt-6">Grace до: ${esc(formatDate(item.grace_until))}</div>
            <div class="small mt-6">Последняя оплата: ${esc(formatDate(item.last_payment_at))}</div>
          </div>
          <div class="toolbar" style="justify-content:flex-end">
            <button class="btn primary" data-action="extend30" data-id="${item.venue_id}">+30 дней</button>
            <button class="btn" data-action="extendCustom" data-id="${item.venue_id}">Продлить на N</button>
            <button class="btn" data-action="setPaidUntil" data-id="${item.venue_id}">Установить дату</button>
            <button class="btn" data-action="refund" data-id="${item.venue_id}" data-price="${Number(item?.last_extension_transaction?.amount_minor || 0)}">Возврат</button>
            <button class="btn subtle" data-action="history" data-id="${item.venue_id}">История</button>
          </div>
        </div>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-action]').forEach((btn) => btn.addEventListener('click', async () => {
      const venueId = btn.getAttribute('data-id');
      const action = btn.getAttribute('data-action');
      if (!venueId) return;
      if (action === 'extend30') return extendVenue(venueId, 30);
      if (action === 'extendCustom') return promptExtendVenue(venueId);
      if (action === 'setPaidUntil') return promptSetPaidUntil(venueId);
      if (action === 'refund') return openRefundModal({ venueId, suggestedMinor: Number(btn.getAttribute('data-price') || 0), venueName: btn.closest('.billing-table-row')?.querySelector('b')?.textContent || '' });
      if (action === 'history') return showHistory(venueId);
    }));
  }

  function renderOperations(items){
    const rows = Array.isArray(items) ? items : [];
    if (!rows.length) { operationsBlock.innerHTML = '<div class="muted">Операций пока нет</div>'; return; }
    operationsBlock.innerHTML = rows.slice(0, 20).map((item) => `
      <div class="billing-table-row">
        <div class="row" style="justify-content:space-between;gap:12px;align-items:flex-start">
          <div>
            <div><b>${esc(item.venue_name || '—')}</b> · ${esc(txTypeLabel(item.type))}</div>
            <div class="small mt-6">${esc(formatDateTime(item.created_at))} · ${esc(txStatusLabel(item.status))}</div>
            <div class="small mt-6">Источник: ${esc(txSourceLabel(item.source))}</div>
            <div class="small mt-6">Сумма: ${esc(formatMinor(item.amount_minor || 0))}</div>
            ${item.comment ? `<div class="small mt-6">Комментарий: ${esc(item.comment)}</div>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderReconciliation(items){
    const rows = Array.isArray(items) ? items : [];
    if (!rows.length) { reconciliationBlock.innerHTML = '<div class="muted">Проблем по выбранному фильтру не найдено</div>'; return; }
    reconciliationBlock.innerHTML = rows.slice(0, 20).map((item) => `
      <div class="billing-table-row">
        <div class="row" style="justify-content:space-between;gap:12px;align-items:flex-start">
          <div>
            <div class="row gap-8" style="flex-wrap:wrap">${issueChip(item.severity)}<span class="status-chip">${esc(issueStatusLabel(item.status))}</span><b>${esc(item.issue_code || '—')}</b></div>
            <div class="small mt-6">${esc(item.venue_name || '—')} · обнаружено ${esc(formatDateTime(item.first_detected_at || item.created_at))}</div>
            <div class="small mt-6">Последний раз: ${esc(formatDateTime(item.last_seen_at || item.created_at))}</div>
            ${item.resolved_at ? `<div class="small mt-6">Закрыто: ${esc(formatDateTime(item.resolved_at))}</div>` : ''}
            <div class="small mt-6">${esc(item.message || '')}</div>
            ${item.resolution_comment ? `<div class="small mt-6">Комментарий: ${esc(item.resolution_comment)}</div>` : ''}
          </div>
          <div class="toolbar" style="justify-content:flex-end">
            ${String(item.status || '').toUpperCase() === 'OPEN' ? `<button class="btn subtle" data-issue-action="resolve" data-issue-id="${item.id}">Решено</button><button class="btn subtle" data-issue-action="ignore" data-issue-id="${item.id}">Игнор</button>` : `<button class="btn subtle" data-issue-action="reopen" data-issue-id="${item.id}">Переоткрыть</button>`}
          </div>
        </div>
      </div>
    `).join('');
    reconciliationBlock.querySelectorAll('[data-issue-action]').forEach((btn) => btn.addEventListener('click', async () => {
      const issueId = btn.getAttribute('data-issue-id');
      const action = btn.getAttribute('data-issue-action');
      if (!issueId || !action) return;
      const comment = prompt('Комментарий', '') || '';
      try {
        await api(`/admin/billing/reconciliation/${encodeURIComponent(issueId)}/${encodeURIComponent(action)}`, { method:'POST', body:{ comment } });
        toast('Статус проблемы обновлён', 'ok');
        await loadHealth();
        await loadReconciliation();
      } catch (e) { toast(e?.data?.detail || e.message || 'Не удалось обновить проблему', 'err'); }
    }));
  }

  async function loadSummary(){ renderSummary(await api('/admin/billing/summary')); }
  async function loadHealth(){ renderHealth(await api('/admin/billing/health')); }
  async function loadVenues(page = currentPage){
    const qp = buildCommonQuery();
    if (statusFilter.value) qp.set('status', statusFilter.value);
    if (dueSoonEl.checked) qp.set('only_due_soon', 'true');
    if (overdueEl.checked) qp.set('only_overdue', 'true');
    qp.set('include_archived', 'true');
    qp.set('sort_by', sortByEl.value || 'paid_until_asc');
    qp.set('page', String(page));
    qp.set('page_size', '50');
    const data = await api(`/admin/billing/venues?${qp.toString()}`);
    renderVenues(data?.items || [], data || {});
  }
  async function loadOperations(){
    const qp = buildCommonQuery();
    if (txTypeFilter.value) qp.set('tx_type', txTypeFilter.value);
    qp.set('page', '1'); qp.set('page_size', '20');
    const data = await api(`/admin/billing/transactions?${qp.toString()}`);
    renderOperations(data?.items || []);
  }
  async function loadReconciliation(){
    const qp = buildCommonQuery();
    qp.set('status', issueStatusFilter?.value || 'OPEN');
    qp.set('page', '1'); qp.set('page_size', '20');
    const data = await api(`/admin/billing/reconciliation?${qp.toString()}`);
    renderReconciliation(data?.items || []);
  }

  async function extendVenue(venueId, days, comment = ''){
    try {
      await api(`/admin/venues/${encodeURIComponent(venueId)}/billing/extend`, { method: 'POST', body: { days, comment, amount_minor: 0 } });
      toast(`Продлено на ${days} дн.`, 'ok');
      await boot();
    } catch (e) { toast(e?.data?.detail || e.message || 'Не удалось продлить', 'err'); }
  }
  async function promptExtendVenue(venueId){ const raw = prompt('На сколько дней продлить?', '30'); if (!raw) return; const days = Number(raw); if (!Number.isFinite(days) || days <= 0) return toast('Введите корректное число', 'warn'); const comment = prompt('Комментарий', '') || ''; await extendVenue(venueId, Math.round(days), comment); }
  async function promptSetPaidUntil(venueId){ const raw = prompt('Установить paid_until (YYYY-MM-DD)', ''); if (!raw) return; const comment = prompt('Комментарий', '') || ''; try { await api(`/admin/venues/${encodeURIComponent(venueId)}/billing/set-paid-until`, { method:'POST', body:{ paid_until:`${raw}T00:00:00+03:00`, comment, amount_minor:0 } }); toast('Дата обновлена', 'ok'); await boot(); } catch (e) { toast(e?.data?.detail || e.message || 'Не удалось обновить дату', 'err'); } }
  function openRefundModal({ venueId, suggestedMinor = 0, venueName = '' }){
    refundVenueId = venueId ? String(venueId) : null;
    refundVenueName = String(venueName || '').trim();
    refundVenueLabelEl.textContent = refundVenueName ? `Заведение: ${refundVenueName}` : `Заведение #${refundVenueId || '—'}`;
    refundAmountInputEl.value = suggestedMinor > 0 ? String((suggestedMinor / 100).toFixed(2)).replace(/\.00$/, '') : '2990';
    refundCommentInputEl.value = '';
    refundModalEl.classList.add('open');
    setTimeout(() => refundAmountInputEl?.focus(), 0);
  }

  function closeRefundModal(){
    refundModalEl.classList.remove('open');
    refundVenueId = null;
    refundVenueName = '';
  }

  async function submitRefundModal(){
    if (!refundVenueId) return;
    const rub = Number(String(refundAmountInputEl.value || '').replace(',', '.'));
    if (!Number.isFinite(rub) || rub <= 0) return toast('Введите корректную сумму', 'warn');
    refundSubmitBtn.disabled = true;
    try {
      await api(`/admin/venues/${encodeURIComponent(refundVenueId)}/billing/refund`, { method:'POST', body:{ amount_minor: Math.round(rub * 100), comment: refundCommentInputEl.value || '', revoke_access_hint: false } });
      closeRefundModal();
      toast('Возврат зафиксирован', 'ok');
      await boot();
    } catch (e) {
      toast(e?.data?.detail || e.message || 'Не удалось зафиксировать возврат', 'err');
    } finally {
      refundSubmitBtn.disabled = false;
    }
  }
  async function showHistory(venueId){ try { const data = await api(`/venues/${encodeURIComponent(venueId)}/billing`); const txs = Array.isArray(data?.transactions) ? data.transactions : []; const events = Array.isArray(data?.events) ? data.events : []; const lines = []; txs.forEach((tx) => lines.push(`[Операция] ${formatDateTime(tx.created_at)} · ${txStatusLabel(tx.status)}\nИсточник: ${txSourceLabel(tx.source)}\nТип: ${txTypeLabel(tx.type)}\nСумма: ${formatMinor(tx.amount_minor || 0)}${tx.comment ? `\nКомментарий: ${tx.comment}` : ''}`)); events.forEach((event) => lines.push(`[Событие] ${formatDateTime(event.created_at)} · ${esc(event.event_type || '—')}`)); openModal(`История · venue #${venueId}`, lines.join('\n\n——————————\n\n') || 'История пуста'); } catch (e) { toast(e?.data?.detail || e.message || 'Не удалось загрузить историю', 'err'); } }

  function exportTransactions(){ const qp = buildCommonQuery(); if (txTypeFilter.value) qp.set('tx_type', txTypeFilter.value); location.href = `/admin/billing/transactions/export?${qp.toString()}`; }
  function exportReconciliation(){ const qp = buildCommonQuery(); qp.set('status', issueStatusFilter?.value || 'OPEN'); location.href = `/admin/billing/reconciliation/export?${qp.toString()}`; }

  async function boot(){ const ok = await ensureLogin({ silent: true }); if (!ok.ok) return; const venuesPromise = (async () => { const qp = buildCommonQuery(); if (statusFilter.value) qp.set('status', statusFilter.value); if (dueSoonEl.checked) qp.set('only_due_soon', 'true'); if (overdueEl.checked) qp.set('only_overdue', 'true'); qp.set('include_archived', 'true'); qp.set('sort_by', sortByEl.value || 'paid_until_asc'); qp.set('page', String(currentPage)); qp.set('page_size', '50'); const data = await api(`/admin/billing/venues?${qp.toString()}`); renderVenues(data?.items || [], data || {}); })(); await Promise.all([loadSummary(), loadHealth(), venuesPromise, loadOperations(), loadReconciliation()]); }

  [statusFilter, txTypeFilter, dueSoonEl, overdueEl, sortByEl, issueStatusFilter].forEach((el) => el?.addEventListener('change', () => { currentPage = 1; boot().catch((e) => toast(e.message, 'err')); }));
  searchEl?.addEventListener('input', () => { clearTimeout(searchEl._t); searchEl._t = setTimeout(() => { currentPage = 1; boot().catch((e) => toast(e.message, 'err')); }, 300); });
  refreshBtn?.addEventListener('click', () => boot().catch((e) => toast(e.message, 'err')));
  prevPageBtn?.addEventListener('click', () => { if (currentPage > 1) { currentPage -= 1; boot().catch((e) => toast(e.message, 'err')); } });
  nextPageBtn?.addEventListener('click', () => { if (hasNextPage) { currentPage += 1; boot().catch((e) => toast(e.message, 'err')); } });
  exportOpsBtn?.addEventListener('click', exportTransactions);
  exportReconBtn?.addEventListener('click', exportReconciliation);
  refundSubmitBtn?.addEventListener('click', submitRefundModal);
  refundModalEl?.querySelectorAll('[data-refund-close]').forEach((el) => el.addEventListener('click', closeRefundModal));

  boot().catch((e) => toast(e.message, 'err'));
</script>
</body>
</html>
