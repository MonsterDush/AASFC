<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css" />
  <title>Axelio · Админ · Биллинг</title>
  <style>
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    .summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    @media (min-width: 900px) { .summary-grid { grid-template-columns:repeat(5,minmax(0,1fr)); } }
    .summary-card { border:1px solid rgba(0,0,0,.12); border-radius:14px; padding:12px; }
    .summary-card b { display:block; font-size:20px; margin-top:6px; }
    .billing-table-row { border:1px solid rgba(0,0,0,.12); border-radius:14px; padding:12px; margin-top:10px; }
    .status-chip, .severity-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid rgba(0,0,0,.14); font-size:12px; }
    .severity-chip.critical { font-weight:700; }
    .severity-chip.high { font-weight:600; }
    .section-grid { display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width: 1000px) { .section-grid { grid-template-columns:1fr 1fr; } }
    input[type="search"], select { min-width: 180px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Админ · Биллинг</b>
          <div class="muted">статусы, возвраты, операции и сверка</div>
        </div>
      </div>
      <div class="userpill" data-userpill>—</div>
    </div>

    <div class="card">
      <div class="summary-grid" id="summaryGrid">
        <div class="summary-card"><div class="muted">Загрузка…</div><b>—</b></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="statusFilter">
          <option value="">Все статусы</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="GRACE">GRACE</option>
          <option value="SUSPENDED">SUSPENDED</option>
        </select>
        <input id="search" type="search" placeholder="Поиск по заведению" />
        <label class="row gap-8"><input id="dueSoon" type="checkbox" /> <span>Скоро заканчивается</span></label>
        <label class="row gap-8"><input id="overdue" type="checkbox" /> <span>Просроченные</span></label>
        <select id="sortBy">
          <option value="paid_until_asc">Сначала истекающие</option>
          <option value="paid_until_desc">Сначала дальние</option>
          <option value="last_payment_desc">Свежие оплаты</option>
          <option value="name_asc">По названию А-Я</option>
          <option value="name_desc">По названию Я-А</option>
        </select>
        <button class="btn" id="refreshBtn">Обновить</button>
        <span class="muted" id="count">0</span>
        <div class="row gap-8" style="margin-left:auto">
          <button class="btn subtle" id="prevPageBtn">← Назад</button>
          <span class="muted" id="pageInfo">1</span>
          <button class="btn subtle" id="nextPageBtn">Вперёд →</button>
        </div>
      </div>
      <div id="list"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>

    <div class="section-grid">
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div>
            <b>Операции</b>
            <div class="muted">Платежи, ручные продления, возвраты и ошибки.</div>
          </div>
          <div class="toolbar" style="margin:0">
            <select id="txTypeFilter">
              <option value="">Все типы</option>
              <option value="PAYMENT">PAYMENT</option>
              <option value="EXTEND">EXTEND</option>
              <option value="SET_PAID_UNTIL">SET_PAID_UNTIL</option>
              <option value="REFUND">REFUND</option>
            </select>
            <select id="txStatusFilter">
              <option value="">Все статусы</option>
              <option value="SUCCEEDED">SUCCEEDED</option>
              <option value="PENDING">PENDING</option>
              <option value="FAILED">FAILED</option>
              <option value="CANCELED">CANCELED</option>
            </select>
            <input id="txSearch" type="search" placeholder="Поиск по операциям" />
            <button class="btn subtle" id="txRefreshBtn">Обновить</button>
          </div>
        </div>
        <div id="transactionsList"><div class="skeleton"></div></div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div>
            <b>Проблемы и сверка</b>
            <div class="muted">Незакрытые ошибки и спорные кейсы биллинга.</div>
          </div>
          <div class="toolbar" style="margin:0">
            <select id="issueTypeFilter">
              <option value="">Все типы</option>
              <option value="STALE_PENDING_CHECKOUT">STALE_PENDING_CHECKOUT</option>
              <option value="SUCCEEDED_NOT_APPLIED">SUCCEEDED_NOT_APPLIED</option>
              <option value="INVALID_SIGNATURE">INVALID_SIGNATURE</option>
              <option value="AMOUNT_MISMATCH">AMOUNT_MISMATCH</option>
              <option value="FAILED_PAYMENT">FAILED_PAYMENT</option>
              <option value="DUPLICATE_CALLBACK">DUPLICATE_CALLBACK</option>
            </select>
            <input id="issueSearch" type="search" placeholder="Поиск по проблемам" />
            <button class="btn subtle" id="issuesRefreshBtn">Обновить</button>
          </div>
        </div>
        <div id="issuesList"><div class="skeleton"></div></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><div class="toast__text"></div></div>
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title">Детали</div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="nav">
    <div class="wrap">
      <div id="nav"></div>
    </div>
  </div>

<script type="module">
  import { applyTelegramTheme, mountCommonUI, ensureLogin, api, toast, mountNav, openModal } from "/app.js";

  applyTelegramTheme();
  mountCommonUI("admin-billing");
  await mountNav({ activeTab: "admin-billing" });

  function esc(s){
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function formatDate(value){
    if (!value) return "—";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString("ru-RU");
  }
  function formatDateTime(value){
    if (!value) return "—";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value);
    return d.toLocaleString("ru-RU", { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function formatMinor(value){
    return `${(Number(value || 0) / 100).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: 0 })} ₽`;
  }

  function txSourceLabel(value){
    const v = String(value || '').toUpperCase();
    if (v === 'MANUAL_ADMIN') return 'Ручная операция';
    if (v === 'ROBOKASSA') return 'Robokassa';
    return v || '—';
  }
  function txTypeLabel(value){
    const v = String(value || '').toUpperCase();
    if (v === 'PAYMENT') return 'Оплата';
    if (v === 'EXTEND') return 'Продление';
    if (v === 'SET_PAID_UNTIL') return 'Установка paid until';
    if (v === 'REFUND') return 'Возврат';
    return v || '—';
  }
  function txStatusLabel(value){
    const v = String(value || '').toUpperCase();
    if (v === 'SUCCEEDED') return 'Успешно';
    if (v === 'PENDING') return 'Ожидает';
    if (v === 'FAILED') return 'Ошибка';
    if (v === 'CANCELED') return 'Отменено';
    return v || '—';
  }
  function eventLabel(value){
    const v = String(value || '').toUpperCase();
    const map = {
      BILLING_EXTENDED_MANUALLY: 'Ручное продление',
      BILLING_PAID_UNTIL_SET_MANUALLY: 'Ручная установка paid until',
      BILLING_REFUND_CREATED: 'Возврат оформлен',
      BILLING_STATUS_CHANGED_AUTO: 'Автопереход статуса',
      ROBOKASSA_PAYMENT_SUCCEEDED: 'Оплата подтверждена',
      ROBOKASSA_PAYMENT_FAILED: 'Ошибка оплаты',
      ROBOKASSA_PAYMENT_CANCELED: 'Платёж отменён',
      ROBOKASSA_PAYMENT_EXPIRED: 'Checkout истёк',
      ROBOKASSA_RESULT_SIGNATURE_INVALID: 'Неверная подпись callback',
      ROBOKASSA_AMOUNT_MISMATCH: 'Несовпадение суммы',
      ROBOKASSA_RESULT_DUPLICATE: 'Повторный callback',
    };
    return map[v] || v || '—';
  }
  function issueTypeLabel(value){
    const v = String(value || '').toUpperCase();
    const map = {
      STALE_PENDING_CHECKOUT: 'Зависший pending checkout',
      SUCCEEDED_NOT_APPLIED: 'SUCCEEDED без периода',
      INVALID_SIGNATURE: 'Неверная подпись callback',
      AMOUNT_MISMATCH: 'Несовпадение суммы',
      FAILED_PAYMENT: 'Ошибка платежа',
      DUPLICATE_CALLBACK: 'Повторный callback',
    };
    return map[v] || v || '—';
  }
  function statusChip(status){
    const s = String(status || '').toUpperCase();
    const cls = s === 'ACTIVE' ? 'active' : (s === 'GRACE' ? 'grace' : 'suspended');
    return `<span class="status-chip ${cls}">${esc(s || '—')}</span>`;
  }
  function severityChip(level){
    const v = String(level || '').toLowerCase();
    return `<span class="severity-chip ${v}">${esc(v || 'unknown')}</span>`;
  }

  const summaryGrid = document.getElementById('summaryGrid');
  const listEl = document.getElementById('list');
  const transactionsListEl = document.getElementById('transactionsList');
  const issuesListEl = document.getElementById('issuesList');
  const statusFilter = document.getElementById('statusFilter');
  const searchEl = document.getElementById('search');
  const dueSoonEl = document.getElementById('dueSoon');
  const overdueEl = document.getElementById('overdue');
  const countEl = document.getElementById('count');
  const refreshBtn = document.getElementById('refreshBtn');
  const sortByEl = document.getElementById('sortBy');
  const prevPageBtn = document.getElementById('prevPageBtn');
  const nextPageBtn = document.getElementById('nextPageBtn');
  const pageInfoEl = document.getElementById('pageInfo');
  const txTypeFilter = document.getElementById('txTypeFilter');
  const txStatusFilter = document.getElementById('txStatusFilter');
  const txSearch = document.getElementById('txSearch');
  const txRefreshBtn = document.getElementById('txRefreshBtn');
  const issueTypeFilter = document.getElementById('issueTypeFilter');
  const issueSearch = document.getElementById('issueSearch');
  const issuesRefreshBtn = document.getElementById('issuesRefreshBtn');

  let currentPage = 1;
  let hasNextPage = false;

  function renderSummary(data){
    const t = data?.totals || {};
    summaryGrid.innerHTML = `
      <div class="summary-card"><div class="muted">Активные</div><b>${Number(t.active || 0)}</b><div class="small">MRR: ${formatMinor(t.mrr_minor || 0)}</div></div>
      <div class="summary-card"><div class="muted">Grace</div><b>${Number(t.grace || 0)}</b><div class="small">Скоро закончится: ${Number(t.due_soon || 0)}</div></div>
      <div class="summary-card"><div class="muted">Suspended</div><b>${Number(t.suspended || 0)}</b><div class="small">Просрочено: ${Number(t.overdue || 0)}</div></div>
      <div class="summary-card"><div class="muted">Поступления за месяц</div><b>${formatMinor(t.receipts_current_month_minor || 0)}</b><div class="small">Всего заведений: ${Number(t.venues_total || 0)}</div></div>
      <div class="summary-card"><div class="muted">Проблемы сверки</div><b>${Number(t.unresolved_issues || 0)}</b><div class="small">Требуют внимания</div></div>
    `;
  }

  function renderVenues(items, meta = {}){
    const rows = Array.isArray(items) ? items : [];
    const total = Number(meta?.total || rows.length || 0);
    currentPage = Number(meta?.page || currentPage || 1);
    hasNextPage = Boolean(meta?.has_next);
    countEl.textContent = `${rows.length} / ${total}`;
    pageInfoEl.textContent = `Стр. ${currentPage}`;
    prevPageBtn.disabled = currentPage <= 1;
    nextPageBtn.disabled = !hasNextPage;
    if (!rows.length) {
      listEl.innerHTML = `<div class="muted">Ничего не найдено</div>`;
      return;
    }
    listEl.innerHTML = rows.map((item) => `
      <div class="billing-table-row">
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
          <div style="min-width:0;flex:1 1 auto;">
            <div class="row gap-8" style="align-items:center;justify-content:flex-start;flex-wrap:wrap">
              <a class="btn subtle inline" href="/app-venue.html?venue_id=${item.venue_id}"><b>${esc(item.venue_name)}</b></a>
              ${statusChip(item.status)}
              ${item.is_archived ? '<span class="badge">архив</span>' : ''}
            </div>
            <div class="small" style="margin-top:6px">Владелец: ${esc(item?.owner?.label || '—')}</div>
            <div class="small" style="margin-top:6px">Оплачено до: ${esc(formatDate(item.paid_until))}</div>
            <div class="small" style="margin-top:6px">Grace до: ${esc(formatDate(item.grace_until))}</div>
            <div class="small" style="margin-top:6px">Последняя оплата: ${esc(formatDate(item.last_payment_at))}</div>
            <div class="small" style="margin-top:6px">Источник последней операции: ${esc(item?.last_extension_source || '—')}</div>
          </div>
          <div class="toolbar" style="justify-content:flex-end;max-width:460px">
            <button class="btn primary" data-action="extend30" data-id="${item.venue_id}">+30 дней</button>
            <button class="btn" data-action="extendCustom" data-id="${item.venue_id}">Продлить на N</button>
            <button class="btn" data-action="refund" data-id="${item.venue_id}" data-name="${esc(item.venue_name)}" data-amount="${Number(item?.last_extension_transaction?.amount_minor || 0)}">Возврат</button>
            <button class="btn" data-action="setPaidUntil" data-id="${item.venue_id}">Установить дату</button>
            <button class="btn subtle" data-action="history" data-id="${item.venue_id}">История</button>
          </div>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-action]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const action = btn.getAttribute('data-action');
        const venueId = btn.getAttribute('data-id');
        if (!venueId) return;
        if (action === 'extend30') return extendVenue(venueId, 30);
        if (action === 'extendCustom') return promptExtendVenue(venueId);
        if (action === 'setPaidUntil') return promptSetPaidUntil(venueId);
        if (action === 'history') return showHistory(venueId);
        if (action === 'refund') return promptRefund(venueId, btn.getAttribute('data-name') || '', Number(btn.getAttribute('data-amount') || 0));
      });
    });
  }

  function renderTransactions(items){
    const rows = Array.isArray(items) ? items : [];
    if (!rows.length) {
      transactionsListEl.innerHTML = `<div class="muted">Операций пока нет</div>`;
      return;
    }
    transactionsListEl.innerHTML = rows.map((tx) => `
      <div class="billing-table-row">
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
          <div style="min-width:0;flex:1 1 auto;">
            <div class="row gap-8" style="flex-wrap:wrap"><b>${esc(tx.venue_name || ('Venue #' + tx.venue_id))}</b><span class="muted">${esc(txTypeLabel(tx.type))}</span><span class="muted">${esc(txStatusLabel(tx.status))}</span></div>
            <div class="small" style="margin-top:6px">${esc(formatDateTime(tx.created_at))} · ${esc(txSourceLabel(tx.source))}</div>
            <div class="small" style="margin-top:6px">Сумма: ${esc(formatMinor(tx.amount_minor || 0))}${tx.days_added ? ` · ${esc('+' + tx.days_added + ' дн.')}` : ''}</div>
            <div class="small" style="margin-top:6px">Счёт: <span class="mono">${esc(tx.provider_invoice_id || '—')}</span></div>
            ${tx.comment ? `<div class="small" style="margin-top:6px">${esc(tx.comment)}</div>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderIssues(data){
    const rows = Array.isArray(data?.items) ? data.items : [];
    if (!rows.length) {
      issuesListEl.innerHTML = `<div class="muted">Открытых проблем не найдено</div>`;
      return;
    }
    issuesListEl.innerHTML = rows.map((item) => `
      <div class="billing-table-row">
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
          <div style="min-width:0;flex:1 1 auto;">
            <div class="row gap-8" style="flex-wrap:wrap"><b>${esc(item.venue_name || ('Venue #' + item.venue_id))}</b>${severityChip(item.severity)}<span class="muted">${esc(issueTypeLabel(item.issue_type))}</span></div>
            <div class="small" style="margin-top:6px">${esc(formatDateTime(item.occurred_at))}</div>
            <div class="small" style="margin-top:6px">${esc(item.description || '—')}</div>
            <div class="small" style="margin-top:6px">Владелец: ${esc(item?.owner?.label || '—')}${item.transaction_id ? ` · Transaction #${esc(item.transaction_id)}` : ''}</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function loadSummary(){
    const data = await api('/admin/billing/summary');
    renderSummary(data);
  }

  async function loadVenues(page = currentPage){
    listEl.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
    const params = new URLSearchParams();
    if (statusFilter.value) params.set('status', statusFilter.value);
    if (searchEl.value.trim()) params.set('q', searchEl.value.trim());
    if (dueSoonEl.checked) params.set('only_due_soon', 'true');
    if (overdueEl.checked) params.set('only_overdue', 'true');
    params.set('include_archived', 'true');
    params.set('sort_by', String(sortByEl?.value || 'paid_until_asc'));
    params.set('page', String(Math.max(1, Number(page || 1))));
    params.set('page_size', '50');
    const data = await api(`/admin/billing/venues?${params.toString()}`);
    renderVenues(data?.items || [], data || {});
  }

  async function loadTransactions(){
    transactionsListEl.innerHTML = `<div class="skeleton"></div>`;
    const params = new URLSearchParams();
    if (txTypeFilter.value) params.set('tx_type', txTypeFilter.value);
    if (txStatusFilter.value) params.set('tx_status', txStatusFilter.value);
    if (txSearch.value.trim()) params.set('q', txSearch.value.trim());
    params.set('page_size', '20');
    const data = await api(`/admin/billing/transactions?${params.toString()}`);
    renderTransactions(data?.items || []);
  }

  async function loadIssues(){
    issuesListEl.innerHTML = `<div class="skeleton"></div>`;
    const params = new URLSearchParams();
    if (issueTypeFilter.value) params.set('issue_type', issueTypeFilter.value);
    if (issueSearch.value.trim()) params.set('q', issueSearch.value.trim());
    params.set('page_size', '20');
    const data = await api(`/admin/billing/reconciliation?${params.toString()}`);
    renderIssues(data || {});
  }

  async function extendVenue(venueId, days, comment = ''){
    try {
      await api(`/admin/venues/${encodeURIComponent(venueId)}/billing/extend`, {
        method: 'POST',
        body: { days, comment, amount_minor: 0 },
      });
      toast(`Продлено на ${days} дн.`, 'ok');
      await boot();
    } catch (e) {
      toast(`Не удалось продлить: ${e.message}`, 'err');
    }
  }

  async function promptExtendVenue(venueId){
    const rawDays = prompt('На сколько дней продлить?', '30');
    if (!rawDays) return;
    const days = Number(rawDays);
    if (!Number.isFinite(days) || days <= 0) {
      toast('Введите корректное количество дней', 'warn');
      return;
    }
    const comment = prompt('Комментарий для истории (необязательно)', '') || '';
    await extendVenue(venueId, Math.round(days), comment);
  }

  async function promptSetPaidUntil(venueId){
    const rawDate = prompt('Установить paid_until (формат YYYY-MM-DD)', '');
    if (!rawDate) return;
    const comment = prompt('Комментарий для истории (необязательно)', '') || '';
    try {
      await api(`/admin/venues/${encodeURIComponent(venueId)}/billing/set-paid-until`, {
        method: 'POST',
        body: { paid_until: `${rawDate}T00:00:00+03:00`, comment, amount_minor: 0 },
      });
      toast('Дата оплаты обновлена', 'ok');
      await boot();
    } catch (e) {
      toast(`Не удалось обновить дату: ${e.message}`, 'err');
    }
  }

  async function promptRefund(venueId, venueName, lastAmountMinor = 0){
    const defaultRub = ((Number(lastAmountMinor || 0) / 100) || 2990).toString().replace(/\.0+$/, '');
    const rawAmount = prompt(`Сумма возврата для «${venueName || ('venue #' + venueId)}» в рублях`, defaultRub);
    if (!rawAmount) return;
    const amount = Number(String(rawAmount).replace(',', '.'));
    if (!Number.isFinite(amount) || amount <= 0) {
      toast('Введите корректную сумму возврата', 'warn');
      return;
    }
    const comment = prompt('Причина возврата (необязательно)', '') || '';
    try {
      await api(`/admin/venues/${encodeURIComponent(venueId)}/billing/refund`, {
        method: 'POST',
        body: { amount_minor: Math.round(amount * 100), comment, revoke_access_hint: false },
      });
      toast('Возврат записан в историю', 'ok');
      await boot();
    } catch (e) {
      toast(`Не удалось оформить возврат: ${e.message}`, 'err');
    }
  }

  async function showHistory(venueId){
    try {
      const data = await api(`/venues/${encodeURIComponent(venueId)}/billing`);
      const txs = Array.isArray(data?.transactions) ? data.transactions : [];
      const events = Array.isArray(data?.events) ? data.events : [];
      if (!txs.length && !events.length) {
        openModal('История биллинга', 'Пока нет операций по этому заведению.');
        return;
      }
      const txLines = txs.map((tx) => [
        `[Операция] ${formatDateTime(tx.created_at)} · ${txStatusLabel(tx.status)}`,
        `Источник: ${txSourceLabel(tx.source)}`,
        `Тип: ${txTypeLabel(tx.type)}`,
        `Сумма: ${formatMinor(tx.amount_minor || 0)}`,
        `Период: ${formatDate(tx.period_from)} → ${formatDate(tx.period_until)}`,
        tx.comment ? `Комментарий: ${tx.comment}` : '',
        '—'.repeat(24),
      ].filter(Boolean).join('\n'));
      const eventLines = events.map((event) => {
        const meta = event?.meta && typeof event.meta === 'object' ? event.meta : {};
        return [
          `[Событие] ${formatDateTime(event.created_at)} · ${eventLabel(event.event_type)}`,
          `Статус: ${event.old_status || '—'} → ${event.new_status || '—'}`,
          meta.transaction_id ? `Transaction ID: ${meta.transaction_id}` : '',
          '—'.repeat(24),
        ].filter(Boolean).join('\n');
      });
      openModal(`История · venue #${venueId}`, [...txLines, ...eventLines].join('\n'));
    } catch (e) {
      toast(`Не удалось загрузить историю: ${e.message}`, 'err');
    }
  }

  async function boot(){
    const ok = await ensureLogin({ silent: true });
    if (!ok.ok) return;
    await Promise.all([loadSummary(), loadVenues(), loadTransactions(), loadIssues()]);
  }

  [statusFilter, dueSoonEl, overdueEl, sortByEl].forEach((el) => el?.addEventListener('change', () => { currentPage = 1; loadVenues(1).catch((e) => toast(e.message, 'err')); }));
  [txTypeFilter, txStatusFilter].forEach((el) => el?.addEventListener('change', () => loadTransactions().catch((e) => toast(e.message, 'err'))));
  issueTypeFilter?.addEventListener('change', () => loadIssues().catch((e) => toast(e.message, 'err')));
  searchEl?.addEventListener('input', () => { clearTimeout(searchEl._t); searchEl._t = setTimeout(() => { currentPage = 1; loadVenues(1).catch((e) => toast(e.message, 'err')); }, 250); });
  txSearch?.addEventListener('input', () => { clearTimeout(txSearch._t); txSearch._t = setTimeout(() => loadTransactions().catch((e) => toast(e.message, 'err')), 250); });
  issueSearch?.addEventListener('input', () => { clearTimeout(issueSearch._t); issueSearch._t = setTimeout(() => loadIssues().catch((e) => toast(e.message, 'err')), 250); });
  refreshBtn?.addEventListener('click', () => boot().catch((e) => toast(e.message, 'err')));
  txRefreshBtn?.addEventListener('click', () => loadTransactions().catch((e) => toast(e.message, 'err')));
  issuesRefreshBtn?.addEventListener('click', () => loadIssues().catch((e) => toast(e.message, 'err')));
  prevPageBtn?.addEventListener('click', () => { if (currentPage <= 1) return; currentPage -= 1; loadVenues(currentPage).catch((e) => toast(e.message, 'err')); });
  nextPageBtn?.addEventListener('click', () => { if (!hasNextPage) return; currentPage += 1; loadVenues(currentPage).catch((e) => toast(e.message, 'err')); });

  await boot();
</script>
</body>
</html>
