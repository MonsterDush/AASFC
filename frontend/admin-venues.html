<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260723-polish1" />
  <script src="/page-loader.js?v=20260720-loader1"></script>
  <title>Axelio · Админ · Заведения</title>

</head>

<body class="admin-venues-page">
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>Админ · Заведения</b>
          <div class="muted">создание и управление заведениями</div>
        </div>
      </div>
      <div class="userpill" data-userpill>—</div>
    </div>

    <div class="toolbar">
      <button id="btnActive" class="btn subtle">Активные</button>
      <button id="btnArchived" class="btn subtle">Архив</button>
      <span id="status" class="muted"></span>
    </div>

    <div id="banner" class="card hidden">
      <b>Не удалось авторизоваться</b>
      <div class="muted mt-6">
        Пожалуйста, открой Mini App через Telegram и попробуй ещё раз.
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div><b>Создать заведение</b></div>
          <div class="muted">Можно сразу назначить владельца или отправить ему приглашение.</div>
        </div>
      </div>

      <div class="toolbar">
        <input id="vName" type="text" placeholder="Название заведения" />
        <select id="ownerMode">
          <option value="tg">Ник в Telegram</option>
          <option value="phone">Телефон</option>
          <option value="user_id">Номер пользователя</option>
          <option value="legacy_multi">Несколько ников в Telegram</option>
        </select>
        <input id="ownerTg" type="text" placeholder="@username" />
        <input class="hidden" id="ownerPhone" type="text" placeholder="+7 999 123-45-67" />
        <input class="hidden" id="ownerUserId" type="text" placeholder="Номер пользователя владельца" />
        <input class="hidden" id="owners" type="text" placeholder="Ники владельцев: ivan, petr" />
        <button id="btnCreate" class="btn primary">Создать</button>
      </div>
      <div id="createResult" class="muted"></div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="По названию или номеру" />
      <span class="muted" id="count">0</span>
    </div>

    <div id="list"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite">
    <div class="toast__text"></div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <div class="row">
        <div class="modal__title"><b>Детали</b></div>
        <button class="btn" data-close>Закрыть</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="nav">
    <div class="wrap">
      <div id="nav"></div>
    </div>
  </div>

<script type="module">
  import {
    applyTelegramTheme,
    mountCommonUI,
    ensureLogin,
    api,
    toast,
    confirmModal,
    openModal,
    mountNav
  } from "/app.js?v=20260722-dynamic1";

  // без replaceAll (Telegram WebView)
  function esc(s){
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function escAttr(s){ return esc(s).replace(/"/g, "&quot;"); }

  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");
  const bannerEl = document.getElementById("banner");
  const createResultEl = document.getElementById("createResult");
  const searchEl = document.getElementById("search");
  const countEl = document.getElementById("count");

  // mode: "active" | "archived"
  let mode = "active";
  let allVenues = [];

  function setStatus(s){ statusEl.textContent = s || ""; }
  function setLastJson(obj){ window.__lastJson = obj; }

  function syncModeButtons(){
    const btnActive = document.getElementById("btnActive");
    const btnArchived = document.getElementById("btnArchived");
    btnActive?.classList.toggle("primary", mode === "active");
    btnArchived?.classList.toggle("primary", mode === "archived");
  }

  function renderSkeleton() {
    listEl.innerHTML = `
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    `;
  }

  function modeFilter(items){
    if (mode === "archived") return items.filter(v => !!v.is_archived);
    return items.filter(v => !v.is_archived);
  }

  function searchFilter(items){
    const q = (searchEl.value || "").trim().toLowerCase();
    if (!q) return items;
    return items.filter(v => {
      const id = String(v?.id ?? "").toLowerCase();
      const name = String(v?.name ?? "").toLowerCase();
      return id.includes(q) || name.includes(q);
    });
  }


  function ownerStatusHtml(summary) {
    const s = summary || {};
    const owners = Array.isArray(s.owners) ? s.owners : [];
    const pending = Array.isArray(s.pending) ? s.pending : [];
    const state = String(s.state || 'UNASSIGNED').toUpperCase();
    const stateChip = state === 'LINKED'
      ? '<span class="tag">владелец назначен</span>'
      : state === 'PENDING'
        ? '<span class="tag">ждёт подтверждения</span>'
        : '<span class="tag muted">владелец не назначен</span>';
    const ownersHtml = owners.length
      ? owners.map(o => `<span class="tag">${esc(o.display_name || o.tg_username || o.phone || 'Пользователь')}</span>`).join(' ')
      : '';
    const pendingHtml = pending.length
      ? pending.map(o => {
          const contact = o.contact_label || o.phone || (o.tg_username ? '@' + o.tg_username : '—');
          return `<span class="tag">ожидает: ${esc(contact)}</span>`;
        }).join(' ')
      : '';
    return `<div class="muted mt-6">${stateChip} ${ownersHtml} ${pendingHtml}</div>`;
  }

  function renderVenues() {
    syncModeButtons();
    const items = searchFilter(modeFilter(allVenues));
    countEl.textContent = String(items.length);

    if (!items.length) {
      listEl.innerHTML = `<div class="muted">Заведений нет</div>`;
      return;
    }

    listEl.innerHTML = items.map(v => {
      const id = escAttr(v.id);
      const name = esc(v.name);
      const isArchived = !!v.is_archived;
      const badge = isArchived
        ? `<span class="tag">архив</span>`
        : `<span class="tag muted">активно</span>`;

      const deleteCheckBtn = `<button class="btn" data-action="deleteCheck" data-id="${id}">Проверка удаления</button>`;
      const deleteBtn = isArchived
        ? `<button class="btn danger" data-action="delete" data-id="${id}">Удалить</button>`
        : `<button class="btn danger" disabled title="Удаление доступно только для архивных заведений">Удалить</button>`;

      return `
        <div class="card">
          <div class="row">
            <div>
              <div>
                <a class="btn subtle inline" href="/app-venue.html?venue_id=${v.id}">
                    <b>${name}</b>
                </a>
                ${badge}
                </div>
              <div class="muted">${v.archived_at ? "В архиве с " + esc(v.archived_at) : "Открыть карточку заведения"}</div>
              ${ownerStatusHtml(v.owner_status)}
            </div>
            <div class="toolbar">
              <button class="btn" data-action="rename" data-id="${id}">Переименовать</button>
              <button class="btn" data-action="toggleArchive" data-id="${id}" data-arch="${isArchived ? "1":"0"}">
                ${isArchived ? "Вернуть из архива" : "В архив"}
              </button>
              ${deleteCheckBtn}
              ${deleteBtn}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  async function loadVenues() {
    setStatus("Загрузка…");
    renderSkeleton();

    try {
      // чтобы увидеть archived — include_archived=true
      const include_archived = (mode === "archived");
      const items = await api(`/venues?include_archived=${include_archived ? "true" : "false"}`);
      allVenues = Array.isArray(items) ? items : [];
      setLastJson({ load: "OK", mode, include_archived, count: allVenues.length, items: allVenues });
      setStatus(`Загружено · ${allVenues.length}`);
      renderVenues();
    } catch (e) {
      setLastJson({ load: "FAILED", message: e?.message, status: e?.status, data: e?.data, url: e?.url });
      setStatus("Ошибка загрузки");
      listEl.innerHTML = `
        <div class="card">
          <b>Не удалось загрузить заведения</b>
          <pre>${esc(e?.message || "Неизвестная ошибка")}</pre>
          <div class="muted">Попробуй обновить страницу или проверить доступ.</div>
        </div>
      `;
      toast(e?.message || "Ошибка загрузки", "err");
    }
  }

  function syncOwnerMode() {
    const mode = document.getElementById("ownerMode").value;
    document.getElementById("ownerTg").classList.toggle("hidden", mode !== "tg");
    document.getElementById("ownerPhone").classList.toggle("hidden", mode !== "phone");
    document.getElementById("ownerUserId").classList.toggle("hidden", mode !== "user_id");
    document.getElementById("owners").classList.toggle("hidden", mode !== "legacy_multi");
  }

  async function createVenue() {
    const name = document.getElementById("vName").value.trim();
    const modeSel = document.getElementById("ownerMode").value;
    const ownersRaw = document.getElementById("owners").value.trim();
    const owner_usernames = ownersRaw
      ? ownersRaw.split(",").map(s => s.trim().replace(/^@/, "")).filter(Boolean)
      : [];

    if (!name) { toast("Укажи название заведения", "warn"); return; }

    const body = { name };
    if (modeSel === "tg") {
      const owner_tg_username = document.getElementById("ownerTg").value.trim();
      if (!owner_tg_username) { toast("Укажи ник владельца в Telegram", "warn"); return; }
      body.owner_tg_username = owner_tg_username;
    } else if (modeSel === "phone") {
      const owner_phone = document.getElementById("ownerPhone").value.trim();
      if (!owner_phone) { toast("Укажи телефон владельца", "warn"); return; }
      body.owner_phone = owner_phone;
    } else if (modeSel === "user_id") {
      const rawId = document.getElementById("ownerUserId").value.trim();
      const owner_user_id = Number(rawId);
      if (!rawId || !Number.isFinite(owner_user_id) || owner_user_id <= 0) { toast("Укажи корректный номер пользователя", "warn"); return; }
      body.owner_user_id = owner_user_id;
    } else if (modeSel === "legacy_multi") {
      if (!owner_usernames.length) { toast("Укажи хотя бы один ник в Telegram", "warn"); return; }
      body.owner_usernames = owner_usernames;
    }

    createResultEl.textContent = "";
    setStatus("Создаю…");

    try {
      const out = await api("/venues", { method: "POST", body });
      setLastJson({ create: "OK", response: out });
      setStatus("Создано");
      if (out?.owner_status?.state === 'LINKED' && out?.owner_linked) {
        const ownerName = out.owner_linked.display_name || out.owner_linked.tg_username || out.owner_linked.phone || 'Пользователь';
        createResultEl.textContent = out?.id ? `Заведение создано · владелец: ${ownerName}` : `Владелец: ${ownerName}`;
      } else if (out?.owner_pending && out?.owner_invite?.invite_link) {
        const pendingContact = out.owner_invite.contact_label || out.owner_invite.phone || (out.owner_invite.tg_username ? '@' + out.owner_invite.tg_username : 'владелец');
        createResultEl.innerHTML = `Заведение создано · владелец сможет присоединиться позже: ${esc(pendingContact)} · <a class="link" href="${escAttr(out.owner_invite.invite_link)}" target="_blank" rel="noreferrer">открыть приглашение</a>`;
      } else {
        createResultEl.textContent = 'Заведение создано';
      }
      toast("Заведение создано", "ok");
      mode = "active";
      await loadVenues();
    } catch (e) {
      setLastJson({ create: "FAILED", message: e?.message, status: e?.status, data: e?.data });
      setStatus("Ошибка создания");
      createResultEl.textContent = e?.message || "Ошибка создания";
      toast(e?.message || "Ошибка создания", "err");
    }
  }

  const DELETE_LABELS = {
    venue_members: "участники",
    venue_invites: "инвайты",
    venue_positions: "должности",
    shift_intervals: "интервалы",
    shifts: "смены",
    shift_assignments: "назначения",
    shift_comments: "комментарии к сменам",
    daily_reports: "отчёты",
    daily_report_attachments: "вложения отчётов",
    daily_report_values: "значения отчётов",
    daily_report_audits: "аудит отчётов",
    daily_report_tip_allocations: "распределения чаевых",
    adjustments: "корректировки",
    adjustment_disputes: "оспаривания",
    adjustment_dispute_comments: "комментарии в спорах",
    penalties: "штрафы",
    bonuses: "премии",
    writeoffs: "списания",
    departments: "департаменты",
    payment_methods: "способы оплаты",
    kpi_metrics: "KPI",
    expense_categories: "категории расходов",
    suppliers: "поставщики",
    expenses: "расходы",
    expense_allocations: "распределения расходов",
    expense_recognition_entries: "признание расходов",
    finance_entries: "финансовые движения",
    balance_adjustments: "корректировки баланса",
    payment_method_transfers: "переводы между оплатами",
    recurring_expense_rules: "правила регулярных расходов",
    recurring_expense_rule_payment_methods: "связки правил и оплат",
    recurring_expense_accruals: "начисления регулярных расходов",
    day_economics_plans: "планы экономики дня",
    day_economics_month_plans: "месячные планы экономики",
    day_economics_plan_templates: "шаблоны экономики дня",
    venue_economics_rules: "правила экономики",
    pay_profiles: "профили начислений",
    pay_components: "компоненты начислений",
    pay_profile_assignments: "назначения профилей",
    payroll_runs: "расчёты начислений",
    payroll_lines: "строки начислений",
    payroll_recalculation_logs: "логи перерасчёта",
    notification_delivery_logs: "логи уведомлений",
  };

  function buildDeleteSummary(check) {
    if (!check || typeof check !== "object") return "Проверка удаления недоступна";
    if (check.requires_archive) return "Сначала отправь заведение в архив, затем удаляй.";
    const groups = Array.isArray(check.non_zero_groups) ? check.non_zero_groups.slice(0, 8) : [];
    if (!groups.length) return "Связанных записей почти нет. Можно удалять.";
    const details = groups.map((item) => `${DELETE_LABELS[item.key] || item.key}: ${item.count}`).join(", ");
    const totalRows = Number(check?.totals?.rows || 0);
    return `Будут удалены связанные данные: ${details}. Всего записей: ${totalRows}.`;
  }

  async function getVenueDeleteCheck(id) {
    return api(`/venues/${encodeURIComponent(id)}/delete-check`);
  }

  async function showDeleteCheck(id) {
    setStatus("Проверяем удаление...");
    try {
      const check = await getVenueDeleteCheck(id);
      setLastJson({ deleteCheck: "OK", response: check });
      openModal("Проверка удаления", {
        venue: check?.venue,
        can_delete: check?.can_delete,
        totals: check?.totals,
        non_zero_groups: check?.non_zero_groups,
      });
      setStatus("Проверка готова");
    } catch (e) {
      setLastJson({ deleteCheck: "FAILED", message: e?.message, status: e?.status, data: e?.data });
      setStatus("Ошибка проверки удаления");
      toast(e?.message || "Ошибка проверки удаления", "err");
    }
  }

  async function renameVenue(id) {
    // найдём текущее имя из allVenues
    const v = allVenues.find(x => String(x?.id) === String(id));
    const current = v?.name || "";

    const newName = prompt("Новое название заведения:", current);
    if (!newName) return;

    const name = newName.trim();
    if (!name) return;

    setStatus("Переименовываю…");
    try {
      const out = await api(`/venues/${encodeURIComponent(id)}`, { method: "PATCH", body: { name } });
      setLastJson({ rename: "OK", response: out });
      setStatus("Переименовано");
      toast("Название обновлено", "ok");
      await loadVenues();
    } catch (e) {
      setLastJson({ rename: "FAILED", message: e?.message, status: e?.status, data: e?.data });
      setStatus("Ошибка переименования");
      toast(e?.message || "Ошибка переименования", "err");
    }
  }

  async function toggleArchiveVenue(id, isArchived) {
    setStatus(isArchived ? "Возвращаю из архива…" : "Переношу в архив…");
    try {
      const out = await api(`/venues/${encodeURIComponent(id)}/${isArchived ? "unarchive" : "archive"}`, { method: "POST" });
      setLastJson({ archiveToggle: "OK", response: out });
      setStatus("Готово");
      toast(isArchived ? "Возвращено из архива" : "Перенесено в архив", "ok");
      await loadVenues();
    } catch (e) {
      setLastJson({ archiveToggle: "FAILED", message: e?.message, status: e?.status, data: e?.data });
      setStatus("Ошибка изменения архива");
      toast(e?.message || "Ошибка изменения архива", "err");
    }
  }

  async function deleteVenue(id) {
    let check = null;
    try {
      check = await getVenueDeleteCheck(id);
    } catch (e) {
      setLastJson({ deleteCheckBeforeDelete: "FAILED", message: e?.message, status: e?.status, data: e?.data });
    }

    const ok = await confirmModal({
      title: "Удалить заведение",
      text: buildDeleteSummary(check),
      confirmText: "Удалить",
      danger: true
    });
    if (!ok) return;

    setStatus("Удаляю…");
    try {
      const out = await api(`/venues/${encodeURIComponent(id)}`, { method: "DELETE" });
      setLastJson({ delete: "OK", response: out, deleteCheck: check });
      setStatus("Удалено");
      toast("Удалено", "ok");
      mode = "archived";
      await loadVenues();
    } catch (e) {
      setLastJson({ delete: "FAILED", message: e?.message, status: e?.status, data: e?.data, deleteCheck: check });
      setStatus("Ошибка удаления");
      toast(e?.message || "Ошибка удаления", "err");
      try {
        await showDeleteCheck(id);
      } catch {}
    }
  }

  document.getElementById("btnActive").addEventListener("click", async () => {
    mode = "active";
    syncModeButtons();
    await loadVenues();
  });

  document.getElementById("btnArchived").addEventListener("click", async () => {
    mode = "archived";
    syncModeButtons();
    await loadVenues();
  });

  document.getElementById("ownerMode").addEventListener("change", syncOwnerMode);
  syncOwnerMode();
  document.getElementById("btnCreate").addEventListener("click", createVenue);


  searchEl.addEventListener("input", renderVenues);

  listEl.addEventListener("click", async (ev) => {
  // 1) переход в карточку
    const a = ev.target.closest("a[data-open-venue]");
    if (a) {
        ev.preventDefault();
        const url = a.getAttribute("href");

        // Telegram WebApp: лучше openLink
        try {
        const tg = window.Telegram?.WebApp;
        if (tg?.openLink) tg.openLink(url);
        else location.href = url;
        } catch {
        location.href = url;
        }
        return;
    }

    // 2) действия (Rename/Archive/Delete)
    const btn = ev.target.closest("button[data-action]");
    if (!btn || btn.disabled) return;

    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if (action === "rename") return renameVenue(id);
    if (action === "toggleArchive") {
      const isArchived = btn.dataset.arch === "1";
      return toggleArchiveVenue(id, isArchived);
    }
    if (action === "deleteCheck") return showDeleteCheck(id);
    if (action === "delete") return deleteVenue(id);
  });

  async function boot() {
    applyTelegramTheme();
    mountCommonUI("admin");
    await mountNav({ activeTab: "admin" });

    // важно: ждём логин, чтобы не было "иногда Load Failed" из-за гонки cookie
    const r = await ensureLogin({ silent: true });
    bannerEl.classList.toggle("hidden", r.ok);
    if (!r.ok) {
      setStatus("Нет авторизации");
      return;
    }

    syncModeButtons();
    await loadVenues();
  }
  boot();
</script>
</body>
</html>
