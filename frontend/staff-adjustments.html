<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260726-navmore1" />
  <link rel="stylesheet" href="/styles/pages/staff-adjustments.css?v=20260726-polish6" />
  <script src="/page-loader.js?v=20260720-loader1"></script>
  <title>Axelio · Штрафы и премии</title>
</head>
<body class="staff-adjustments-page">
  <div class="container staff-adjustments-shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b id="title">Штрафы и премии</b>
          <div class="muted" id="subtitle">штрафы, списания и премии</div>
        </div>
      </div>
      <div class="userpill" data-userpill>…</div>
    </div>

    <main class="staff-adjustments-content">
    <section class="card section-card staff-adjustments-card">
      <div class="staff-adjustments-toolbar">
        <div class="staff-adjustments-month">
          <button class="btn" id="monthPrev">◀</button>
          <b id="monthLabel">…</b>
          <button class="btn" id="monthNext">▶</button>
        </div>
        <div class="staff-adjustments-actions">
          <button class="btn primary hidden" id="btnAddAdj">+ Добавить</button>
          <label class="staff-adjustments-filter">
            <span class="muted small">Показать</span>
          <select id="typeSel">
            <option value="">Все</option>
            <option value="penalty">Штрафы</option>
            <option value="writeoff">Списания</option>
            <option value="bonus">Премии</option>
          </select>
          </label>
        </div>
      </div>

      <div id="list" class="staff-adjustments-list" aria-live="polite">
        <div class="staff-adjustments-loading">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>
    </section>
    </main>

    <div class="nav">
      <div class="wrap">
        <div id="nav"></div>
      </div>
    </div>

    <div class="toast" id="toast"><div class="toast__text"></div></div>
    <div class="modal" id="modal">
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <div class="modal__head">
          <div>
            <b class="modal__title">Деталка</b>
            <div class="modal__subtitle" id="modalSubtitle"></div>
          </div>
          <button class="btn" data-close>Закрыть</button>
        </div>
        <div class="modal__body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/staff-adjustments.js?v=20260726-navmore1"></script>
</body>
</html>
