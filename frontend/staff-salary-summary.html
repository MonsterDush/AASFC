<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="/telegram-loader.js?v=20260326-tgloader1"></script>
  <link rel="stylesheet" href="/styles.css?v=20260802-navbuttons1" />
  <script>
    (() => {
      try {
        const requested = new URLSearchParams(location.search).get("lang");
        const stored = localStorage.getItem("axelio.lang");
        const detected = String(requested || stored || navigator.languages?.[0] || navigator.language || "ru").toLowerCase();
        document.documentElement.lang = detected.startsWith("en") ? "en" : "ru";
      } catch {}
    })();
  </script>
  <script type="module" src="/i18n-bootstrap.js?v=20260820-i18n6"></script>
  <script src="/page-loader.js?v=20260823-navfix1"></script>
  <title>Axelio · Сводка зарплаты</title>
</head>
<body>
  <div class="container">
    <div class="card mt-16">
      <b>Загрузка…</b>
      <div class="muted mt-6">Перенаправляем на единую страницу зарплаты.</div>
    </div>
  </div>

  <script type="module">
import { getActiveVenueId, setActiveVenueId } from "/app.js?v=20260820-i18nmetrika1";
const p = new URLSearchParams(location.search);
const venueId = p.get("venue_id") || getActiveVenueId();
if (venueId) setActiveVenueId(venueId);
const month = p.get("month");
const q = new URLSearchParams();
if (venueId) q.set("venue_id", String(venueId));
q.set("scope", "all");
if (month) q.set("month", month);
location.replace(`/staff-salary.html?${q.toString()}`); // redirectToUnifiedSalary
  </script>
</body>
</html>
