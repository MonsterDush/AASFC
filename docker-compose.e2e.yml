name: axelio-e2e

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${E2E_DB_USER:-axelio_e2e}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:-axelio_e2e}
      POSTGRES_DB: ${E2E_DB_NAME:-axelio_e2e}
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${E2E_DB_USER:-axelio_e2e} -d ${E2E_DB_NAME:-axelio_e2e}"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
