name: Deploy

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axelio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axelio_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/axelio_test
      TG_BOT_TOKEN: ci-not-used
      TG_BROWSER_LOGIN_BOT_USERNAME: axelio_ci_bot
      JWT_SECRET: axelio-ci-secret-not-for-runtime
      JWT_ISS: axelio-ci
      JWT_AUD: axelio-ci
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      PHONE_AUTH_PROVIDER: console
      PHONE_AUTH_DEBUG_REVEAL_CODE: "false"
      DEMO_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            bot_service/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.16.0"

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r bot_service/requirements.txt

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Python
        run: python -m compileall -q backend/app bot_service

      - name: Lint Python and check critical formatting
        run: |
          python -m ruff check --select E9,F63,F7,F82 backend/app backend/test bot_service tools
          python -m ruff check \
            backend/app/auth/jwt_tokens.py \
            backend/app/auth/passwords.py \
            backend/app/core/permission_policy.py \
            backend/app/services/billing/access.py \
            backend/app/services/billing/state.py \
            backend/app/services/finance/recognition.py \
            backend/app/services/financial_privacy.py \
            backend/app/services/payroll/calculator.py \
            backend/app/services/security_rate_limits.py \
            backend/app/services/signed_links.py \
            backend/test/test_auth_security_primitives.py \
            backend/test/test_financial_privacy.py \
            backend/test/test_permission_policy.py \
            backend/test/test_security_rate_limits.py \
            backend/test/test_signed_links.py \
            tools/check_critical_coverage.py \
            tools/check_repository_hygiene.py
          python -m ruff format --check \
            backend/app/auth/jwt_tokens.py \
            backend/app/auth/passwords.py \
            backend/app/core/permission_policy.py \
            backend/app/services/billing/access.py \
            backend/app/services/billing/state.py \
            backend/app/services/finance/recognition.py \
            backend/app/services/financial_privacy.py \
            backend/app/services/payroll/calculator.py \
            backend/app/services/security_rate_limits.py \
            backend/app/services/signed_links.py \
            backend/test/test_auth_security_primitives.py \
            backend/test/test_financial_privacy.py \
            backend/test/test_permission_policy.py \
            backend/test/test_security_rate_limits.py \
            backend/test/test_signed_links.py \
            tools/check_critical_coverage.py \
            tools/check_repository_hygiene.py

      - name: Check repository hygiene and shell syntax
        run: |
          python tools/check_repository_hygiene.py
          bash -n \
            tools/e2e-local.sh \
            tools/migration-smoke.sh \
            ops/backup/postgres-backup.sh \
            ops/backup/restore-drill.sh \
            ops/backup/production-restore-drill.sh \
            ops/monitoring/health-check.sh \
            ops/monitoring/observability-drill.sh \
            ops/production-assurance-drill.sh \
            ops/nginx/activate-performance.sh \
            ops/deploy/post-deploy-smoke.sh \
            ops/deploy/production-readiness.sh \
            ops/deploy/release.sh

      - name: Run backend tests with branch coverage gate
        working-directory: backend
        run: |
          python -m coverage run --branch --source=app -m unittest discover -s test -v
          python -m coverage report --show-missing --fail-under=42
          python ../tools/check_critical_coverage.py

      - name: Run bot tests
        working-directory: bot_service
        run: python -m unittest discover -s test -v

      - name: PostgreSQL migration round-trip smoke
        env:
          ALEMBIC_BIN: alembic
        run: tools/migration-smoke.sh

      - name: Audit runtime dependencies
        run: |
          python -m pip_audit --strict -r backend/requirements.txt
          python -m pip_audit --strict -r bot_service/requirements.txt
          pnpm audit --audit-level high

      - name: Check tracked JavaScript syntax
        run: |
          git ls-files -z 'frontend/*.js' 'frontend/**/*.js' 'frontend/*.mjs' 'frontend/**/*.mjs' 'tools/*.mjs' |
            xargs -0 -n1 node --check

      - name: Enforce frontend performance budgets
        run: pnpm test:budgets

      - name: Run frontend contracts
        run: |
          node frontend/app_split_check.mjs
          node frontend/owner_pay_profile_split_check.mjs
          node frontend/owner_setup_split_check.mjs
          node frontend/positions_split_check.mjs
          node frontend/staff_shifts_split_check.mjs
          node frontend/style_contract_check.mjs
          node frontend/finance_ledger_contract_check.mjs
          node frontend/finance_summary_contract_check.mjs
          node frontend/payroll_analytics_contract_check.mjs
          node frontend/revenue_analytics_contract_check.mjs

      - name: Browser E2E owner, staff and public demo
        env:
          DEMO_ENABLED: "true"
          FRONTEND_BASE_URL: http://127.0.0.1:8765
          APP_BASE_URL: http://127.0.0.1:8765
          API_BASE_URL: http://127.0.0.1:9001
          CORS_ALLOW_ORIGINS: http://127.0.0.1:8765
          AXELIO_E2E_ALLOW_SEED: "1"
          E2E_OWNER_PHONE: "+79990000001"
          E2E_STAFF_PHONE: "+79990000002"
          E2E_ADMIN_PHONE: "+79990000003"
          E2E_PASSWORD: AxelioE2E123!
          E2E_VENUE_NAME: Axelio E2E Lounge
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          (
            cd backend
            python -m app.core.sync_permissions
            python -m app.scripts.seed_position_permission_templates
            python -m app.scripts.bootstrap_e2e_data
            python -m app.scripts.bootstrap_demo_data \
              --make-public \
              --venue-name "Axelio CI Public Demo"
          )

          (cd backend && exec python -m uvicorn app.main:app --host 127.0.0.1 --port 9001) \
            >"${RUNNER_TEMP}/axelio-api.log" 2>&1 &
          api_pid=$!
          python -m http.server 8765 --bind 127.0.0.1 --directory frontend \
            >"${RUNNER_TEMP}/axelio-frontend.log" 2>&1 &
          frontend_pid=$!
          cleanup() {
            kill "${api_pid}" "${frontend_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9001/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:8765/auth.html >/dev/null; then
              break
            fi
            if [[ "${attempt}" = "30" ]]; then
              cat "${RUNNER_TEMP}/axelio-api.log"
              cat "${RUNNER_TEMP}/axelio-frontend.log"
              exit 1
            fi
            sleep 1
          done

          pnpm test:browser

      - name: Encrypted PostgreSQL backup and restore drill
        env:
          RESTORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/axelio_restore_drill
          BACKUP_ENCRYPTION_PASSWORD: axelio-ci-restore-drill-only
          BACKUP_VERIFY_TABLES: users venues finance_entries payroll_runs
          RELEASE_VERSION: ${{ github.sha }}
        run: ops/backup/restore-drill.sh

  production_readiness:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-readiness
      cancel-in-progress: false
    environment:
      name: production-readiness
    steps:
      - name: Check secrets presence
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "SSH_HOST is empty"; exit 1; }
          test -n "${{ secrets.SSH_USER }}" || { echo "SSH_USER is empty"; exit 1; }
          test -n "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY is empty"; exit 1; }
          test -n "${{ secrets.SSH_PORT }}" || { echo "SSH_PORT is empty"; exit 1; }

      - name: Verify production observability and offsite backup
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
          PROD_APP_ROOT: /var/www/axelio/prod
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: RELEASE_SHA,PROD_APP_ROOT
          script: |
            set -euo pipefail
            REPO_DIR="${PROD_APP_ROOT}/repo"
            READINESS_TOOL_DIR="${PROD_APP_ROOT}/.readiness-tools"

            git -C "${REPO_DIR}" fetch --prune origin
            git -C "${REPO_DIR}" cat-file -e "${RELEASE_SHA}^{commit}"
            install -d -m 0700 "${READINESS_TOOL_DIR}"
            git -C "${REPO_DIR}" show \
              "${RELEASE_SHA}:ops/deploy/production-readiness.sh" \
              >"${READINESS_TOOL_DIR}/production-readiness.sh"
            git -C "${REPO_DIR}" show \
              "${RELEASE_SHA}:ops/backup/postgres-backup.sh" \
              >"${READINESS_TOOL_DIR}/postgres-backup.sh"
            git -C "${REPO_DIR}" show \
              "${RELEASE_SHA}:ops/nginx/activate-performance.sh" \
              >"${READINESS_TOOL_DIR}/activate-nginx-performance.sh"
            chmod 0700 \
              "${READINESS_TOOL_DIR}/production-readiness.sh" \
              "${READINESS_TOOL_DIR}/postgres-backup.sh" \
              "${READINESS_TOOL_DIR}/activate-nginx-performance.sh"

            sudo PROD_APP_ROOT="${PROD_APP_ROOT}" \
              RELEASE_SHA="${RELEASE_SHA}" \
              BACKUP_SCRIPT="${READINESS_TOOL_DIR}/postgres-backup.sh" \
              "${READINESS_TOOL_DIR}/production-readiness.sh"
            sudo AXELIO_NGINX_SCOPE=production \
              NGINX_ACTIVATE_DRY_RUN=true \
              "${READINESS_TOOL_DIR}/activate-nginx-performance.sh"

  deploy:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && 'https://app.axelio.ru' || 'https://app-dev.axelio.ru' }}
    steps:
      - name: Check secrets presence
        run: |
          test -n "${{ secrets.SSH_HOST }}" || { echo "SSH_HOST is empty"; exit 1; }
          test -n "${{ secrets.SSH_USER }}" || { echo "SSH_USER is empty"; exit 1; }
          test -n "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY is empty"; exit 1; }
          test -n "${{ secrets.SSH_PORT }}" || { echo "SSH_PORT is empty"; exit 1; }

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_ACTOR: ${{ github.actor }}
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_ROOT: ${{ github.ref_name == 'main' && '/var/www/axelio/prod' || '/var/www/axelio/dev' }}
          BRANCH: ${{ github.ref_name }}
          ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          API_SERVICE: ${{ github.ref_name == 'main' && 'axelio-api-prod' || 'axelio-api-dev' }}
          BOT_SERVICE: ${{ github.ref_name == 'main' && 'axelio-bot-prod' || 'axelio-bot-dev' }}
          SHIFT_TIMER: ${{ github.ref_name == 'main' && 'axelio-shift-reminders-prod.timer' || 'axelio-shift-reminders-dev.timer' }}
          NOTIFY_TIMER: ${{ github.ref_name == 'main' && 'axelio-notification-jobs-prod.timer' || 'axelio-notification-jobs-dev.timer' }}
          API_BASE_URL: ${{ github.ref_name == 'main' && 'https://api.axelio.ru' || 'https://api-dev.axelio.ru' }}
          FRONTEND_BASE_URL: ${{ github.ref_name == 'main' && 'https://app.axelio.ru' || 'https://app-dev.axelio.ru' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: RELEASE_SHA,CI_ACTOR,CI_RUN_URL,APP_ROOT,BRANCH,ENV_NAME,API_SERVICE,BOT_SERVICE,SHIFT_TIMER,NOTIFY_TIMER,API_BASE_URL,FRONTEND_BASE_URL
          script: |
            set -euo pipefail
            REPO_DIR="${APP_ROOT}/repo"
            DEPLOY_TOOL_DIR="${APP_ROOT}/.deploy-tools"

            git -C "${REPO_DIR}" fetch --prune origin
            install -d -m 0700 "${DEPLOY_TOOL_DIR}"
            git -C "${REPO_DIR}" show \
              "${RELEASE_SHA}:ops/deploy/release.sh" \
              >"${DEPLOY_TOOL_DIR}/release.sh"
            git -C "${REPO_DIR}" show \
              "${RELEASE_SHA}:ops/deploy/post-deploy-smoke.sh" \
              >"${DEPLOY_TOOL_DIR}/post-deploy-smoke.sh"
            chmod 0700 \
              "${DEPLOY_TOOL_DIR}/release.sh" \
              "${DEPLOY_TOOL_DIR}/post-deploy-smoke.sh"

            SMOKE_SCRIPT="${DEPLOY_TOOL_DIR}/post-deploy-smoke.sh" \
              "${DEPLOY_TOOL_DIR}/release.sh" deploy
