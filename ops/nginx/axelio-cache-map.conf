# Installed into /etc/nginx/conf.d so it is evaluated in the http context.
# Only explicitly versioned static resources receive a year-long immutable TTL.
map "$uri|$arg_v" $axelio_versioned_cache_control {
  default "";
  ~^/runtime-config\.json\| "no-store";
  ~*^/[^|]+\.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?)\|[^|]+$ "public, max-age=31536000, immutable";
}
