# Include this snippet in every Axelio frontend and API server block.
# The map installed in /etc/nginx/conf.d/axelio-cache-map.conf gives only
# versioned static URLs (?v=...) an immutable one-year cache lifetime.
etag on;
add_header Cache-Control $axelio_versioned_cache_control always;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/plain
  text/xml;
