# Include this snippet in every Axelio frontend and API server block.
# Cache lifetime remains controlled by the existing server configuration;
# versioned asset URLs are enforced and measured by the application CI.
etag on;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/plain
  text/xml;
