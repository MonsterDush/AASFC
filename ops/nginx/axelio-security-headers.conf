# Include this snippet in every app.axelio.ru, app-dev.axelio.ru,
# api.axelio.ru and api-dev.axelio.ru server block.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The current frontend contains inline scripts/styles, Telegram WebApp and
# Yandex Metrika. This policy protects framing/object/base/form boundaries
# without breaking Telegram Web, which loads Mini Apps in an iframe.
# X-Frame-Options is intentionally omitted here because it cannot express the
# Telegram allowlist; API responses still set X-Frame-Options: DENY in FastAPI.
# Tightening inline allowances is a separate browser-tested refactor.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://metrika.yandex.ru https://analytics.yandex.ru https://metr.yandex.ru https://metrica.ya.ru https://metrica.yandex.ru https://metrika.ya.ru; form-action 'self'; script-src 'self' 'unsafe-inline' https://telegram.org https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.axelio.ru https://api-dev.axelio.ru https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.yandex.com wss://mc.webvisor.com wss://mc.webvisor.org; font-src 'self' data:; child-src blob: https://mc.yandex.ru; frame-src blob: https://mc.yandex.ru; upgrade-insecure-requests" always;
